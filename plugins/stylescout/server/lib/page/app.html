        { id: 'body', label: '正文区', kinds: ['section', 'features', 'testimonials'], hint: '主要正文内容' },
        { id: 'more', label: '相关内容', kinds: ['section', 'features', 'testimonials', 'pricing', 'faq'], hint: '推荐或附录' },
        { id: 'footer', label: '页脚', kinds: ['footer'], hint: '链接与版权' },
      ],
    },
  ]

  function currentTemplate() {
    const custom = state.customTemplates.find((template) => template.id === draft.templateId)
    if (custom !== undefined) return custom
    return TEMPLATES.find((template) => template.id === draft.templateId) || TEMPLATES[0]
  }

  /** Runtime slot list (template defaults + user-inserted slots). */
  function templateSlots() {
    if (!Array.isArray(draft.slotList) || draft.slotList.length === 0) {
      draft.slotList = currentTemplate().slots.map((slot) => ({ ...slot }))
    }
    return draft.slotList
  }

  function resetSlotListForTemplate() {
    draft.slotList = currentTemplate().slots.map((slot) => ({ ...slot }))
    const keep = new Set(draft.slotList.map((slot) => slot.id))
    draft.slots = Object.fromEntries(Object.entries(draft.slots).filter(([slotId]) => keep.has(slotId)))
  }

  function insertSlotFromItem(index, item) {
    const kind = item.type === 'section' ? item.kind : item.type
    const slot = {
      id: 'slot_' + nextBlockId(),
      label: item.type === 'section' ? (kind + ' 区块') : (item.type === 'image' ? '图片' : (item.kind || '组件')),
      kinds: item.type === 'section' ? [kind] : [],
      hint: item.label || '',
      custom: true,
    }
    const list = templateSlots()
    list.splice(Math.max(0, Math.min(list.length, index)), 0, slot)
    draft.slots[slot.id] = itemBlock(item)
    saveDraft()
    setStatus('已插入新空位并填入：' + (item.label || kind), 'ok')
  }

  function moveSlotToIndex(slotId, targetIndex) {
    const list = templateSlots()
    const from = list.findIndex((slot) => slot.id === slotId)
    if (from < 0) return
    const [slot] = list.splice(from, 1)
    let to = targetIndex
    if (from < to) to -= 1
    to = Math.max(0, Math.min(list.length, to))
    list.splice(to, 0, slot)
    saveDraft()
  }

  function removeCustomSlot(slotId) {
    draft.slotList = templateSlots().filter((slot) => slot.id !== slotId)
    delete draft.slots[slotId]
    if (draft.slotStyles) delete draft.slotStyles[slotId]
    saveDraft()
  }

  /* ---------- custom templates + per-slot styling ---------- */
  function loadCustomTemplates() {
    try {
      const raw = JSON.parse(localStorage.getItem('ss.customTemplates.v2') || '[]')
      state.customTemplates = Array.isArray(raw) ? raw : []
    } catch {
      state.customTemplates = []
    }
  }

  function persistCustomTemplates() {
    try { localStorage.setItem('ss.customTemplates.v2', JSON.stringify(state.customTemplates)) } catch {}
  }

  function isCustomTemplateId(id) {
    return typeof id === 'string' && id.startsWith('tpl_')
  }

  function saveAsTemplate() {
    const name = window.prompt('模板名称', currentTemplate().name + ' 副本')
    if (name === null) return
    const clean = name.trim()
    if (clean === '') return
    const slots = templateSlots().map((slot) => ({
      id: slot.id,
      label: slot.label,
      kinds: Array.isArray(slot.kinds) ? slot.kinds.slice() : [],
      hint: slot.hint || '',
      custom: slot.custom === true,
    }))
    const template = {
      id: 'tpl_' + Date.now().toString(36),
      name: clean,
      slots,
      createdAt: new Date().toISOString(),
    }
    state.customTemplates.unshift(template)
    persistCustomTemplates()
    draft.templateId = template.id
    draft.slotList = template.slots.map((slot) => ({ ...slot }))
    saveDraft()
    setStatus('已保存模板：' + clean, 'ok')
  }

  function deleteCurrentTemplate() {
    const template = state.customTemplates.find((item) => item.id === draft.templateId)
    if (template === undefined) return
    if (!window.confirm('删除模板「' + template.name + '」？')) return
    state.customTemplates = state.customTemplates.filter((item) => item.id !== template.id)
    persistCustomTemplates()
    draft.templateId = 'landing'
    resetSlotListForTemplate()
    saveDraft()
    setStatus('已删除模板', 'ok')
  }

  function slotStyleOf(slotId) {
    return (draft.slotStyles && draft.slotStyles[slotId]) || { pad: 0, bg: 'transparent' }
  }

  function slotBgCss(bg) {
    if (bg === 'surface') return 'var(--surface)'
    if (bg === 'accent') return '#eef2ff'
    return 'transparent'
  }

  function updateSlotStyle(slotId, patch) {
    const next = Object.assign({ pad: 0, bg: 'transparent' }, slotStyleOf(slotId), patch)
    draft.slotStyles[slotId] = next
    saveDraft()
  }

  /* ---------- template JSON import / export (agent-friendly) ---------- */
  function buildTemplateJson() {
    return {
      schema: 'style-scout/template@1',
      name: currentTemplate().name,
      slots: templateSlots().map((slot) => ({
        id: slot.id,
        label: slot.label,
        kinds: Array.isArray(slot.kinds) ? slot.kinds : [],
        hint: slot.hint || '',
        style: slotStyleOf(slot.id),
        custom: slot.custom === true,
      })),
      fills: templateSlots()
        .filter((slot) => draft.slots[slot.id] !== undefined)
        .map((slot) => ({
          slotId: slot.id,
          captureId: draft.slots[slot.id].captureId || null,
          sectionId: draft.slots[slot.id].sectionId || null,
        })),
    }
  }

  async function syncTemplateToHost(data) {
    try {
      await api('/style-scout/api/templates', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: data.name, template: data }),
      })
    } catch { /* host route may be older; download already succeeded */ }
  }

  function exportTemplate() {
    const data = buildTemplateJson()
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    const anchor = document.createElement('a')
    anchor.href = url
    anchor.download = (data.name || 'style-scout-template').replace(/[\\/:*?"<>|]/g, '-') + '.json'
    document.body.append(anchor)
    anchor.click()
    anchor.remove()
    setTimeout(() => URL.revokeObjectURL(url), 2000)
    syncTemplateToHost(data)
    setStatus('已导出模板 JSON（并尝试同步到 host）', 'ok')
  }

  async function loadHostTemplates() {
    try {
      const data = await api('/style-scout/api/templates')
      state.hostTemplates = Array.isArray(data.templates) ? data.templates : []
    } catch {
      state.hostTemplates = []
    }
  }

  async function applyImportedTemplate(raw) {
    if (state.entries.length === 0) {
      try { await loadLibrary() } catch { /* keep going; fills will be reported as unresolved */ }
    }
    const slots = Array.isArray(raw && raw.slots)
      ? raw.slots.filter((slot) => slot && typeof slot.id === 'string' && typeof slot.label === 'string')
      : []
    if (slots.length === 0) {
      setStatus('模板没有可用空位', 'error')
      return
    }
    const template = {
      id: 'tpl_' + Date.now().toString(36),
      name: String(raw.name || '导入模板').slice(0, 40),
      slots: slots.map((slot) => ({
        id: slot.id,
        label: slot.label,
        kinds: Array.isArray(slot.kinds) ? slot.kinds : [],
        hint: typeof slot.hint === 'string' ? slot.hint : '',
        custom: slot.custom === true,
      })),
      createdAt: new Date().toISOString(),
    }
    state.customTemplates.unshift(template)
    persistCustomTemplates()
    draft.templateId = template.id
    draft.slotList = template.slots.map((slot) => ({ ...slot }))
    draft.slots = {}
    draft.slotStyles = {}
    for (const slot of slots) {
      if (slot.style && (Number(slot.style.pad) > 0 || (slot.style.bg && slot.style.bg !== 'transparent'))) {
        draft.slotStyles[slot.id] = { pad: Number(slot.style.pad) || 0, bg: slot.style.bg || 'transparent' }
      }
    }
    const fills = Array.isArray(raw.fills) ? raw.fills : []
    let filled = 0
    let unresolved = 0
    for (const fill of fills) {
      if (!fill || typeof fill.slotId !== 'string') continue
      if (!template.slots.some((slot) => slot.id === fill.slotId)) continue
      const entry = state.entries.find((item) => item.id === fill.captureId)
      const section = entry && (entry.sections || []).find((item) => item.id === fill.sectionId)
      if (entry === undefined || section === undefined) {
        unresolved += 1
        continue
      }
      draft.slots[fill.slotId] = {
        id: nextBlockId(),
        type: 'section',
        captureId: entry.id,
        sectionId: section.id,
        label: (entry.label || entry.id) + ' · ' + (section.kind || 'section'),
        kindLabel: section.kind || 'section',
        bbox: section.bbox || null,
      }
      filled += 1
    }
    state.templateImport = false
    saveDraft()
    setStatus(
      '已导入模板：' + template.name + (filled > 0 ? '（填入 ' + filled + ' 个空位）' : '') + (unresolved > 0 ? '，' + unresolved + ' 个 fill 未匹配（资产库缺少对应区块）' : ''),
      filled > 0 ? 'ok' : 'error',
    )
  }

  function importTemplateFile(file) {
    if (file === undefined || file === null) return
    file.text()
      .then((text) => applyImportedTemplate(JSON.parse(text)))
      .catch(() => setStatus('读取模板文件失败', 'error'))
  }

  function renderTemplateImportPanel() {
    const panel = el('div', { class: 'picker' })
    panel.append(el('div', { class: 'picker-head' }, [
      el('span', { text: '导入页面模板' }),
      el('button', { type: 'button', class: 'icon-btn', text: '关闭', onclick: () => { state.templateImport = false; renderCanvas() } }),
    ]))
    const body = el('div', { style: { padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: '8px' } })
    body.append(el('div', { class: 'hint', text: '来源：host 的 templates/ 目录（可由 agent 生成），或上传 JSON 文件。' }))
    const list = el('div', { class: 'theme-list' })
    if (state.hostTemplates.length === 0) {
      list.append(el('div', { class: 'hint', text: 'host 里没有模板文件。' }))
    }
    for (const template of state.hostTemplates) {
      list.append(el('div', { class: 'theme-item' }, [
        el('span', { class: 'theme-name', text: template.name + ' · ' + template.slots + ' 空位' + (template.fills > 0 ? ' · ' + template.fills + ' 已填' : '') }),
        el('button', {
          type: 'button',
          class: 'mini',
          text: '导入',
          onclick: async () => {
            try {
              const data = await api('/style-scout/api/templates/' + encodeURIComponent(template.file))
              applyImportedTemplate(data.template)
            } catch (error) {
              setStatus('导入失败：' + error.message, 'error')
            }
          },
        }),
      ]))
    }
    body.append(list)
    body.append(el('button', { type: 'button', class: 'mini', text: '上传 JSON 文件', onclick: () => { $('template-file').click() } }))
    panel.append(body)
    return panel
  }

  function candidateBlocks() {
    const candidates = []
    for (const entry of state.entries) {
      const sections = Array.isArray(entry.sections) ? entry.sections : []
      for (const section of sections) {
        candidates.push({
          entryId: entry.id,
          entryLabel: entry.label || entry.id,
          sectionId: section.id,
          kind: section.kind || 'section',
          text: section.text || '',
          shotUrl: section.shotUrl || null,
          bbox: section.bbox || null,
        })
      }
    }
    return candidates
  }

  function candidatesForSlot(slot) {
    const all = candidateBlocks()
    const kinds = Array.isArray(slot.kinds) ? slot.kinds : []
    if (kinds.length === 0) return all
    const matched = all.filter((candidate) => kinds.includes(candidate.kind))
    return matched.length > 0 ? matched : all
  }

  function fillSlot(slotId, candidate) {
    draft.slots[slotId] = {
      id: nextBlockId(),
      type: 'section',
      captureId: candidate.entryId,
      sectionId: candidate.sectionId,
      label: candidate.entryLabel + ' · ' + candidate.kind,
      kindLabel: candidate.kind,
      bbox: candidate.bbox,
    }
    state.picker = null
    saveDraft()
  }

  function autoFillTemplate() {
    let filled = 0
    for (const slot of templateSlots()) {
      if (draft.slots[slot.id]) continue
      const candidate = candidatesForSlot(slot)[0]
      if (!candidate) continue
      draft.slots[slot.id] = {
        id: nextBlockId(),
        type: 'section',
        captureId: candidate.entryId,
        sectionId: candidate.sectionId,
        label: candidate.entryLabel + ' · ' + candidate.kind,
        kindLabel: candidate.kind,
        bbox: candidate.bbox,
      }
      filled += 1
    }
    saveDraft()
    setStatus(filled > 0 ? '已自动填充 ' + filled + ' 个空位' : '没有可填充的空位或资产', filled > 0 ? 'ok' : 'error')
  }

  function activeBlocks() {
    if (draft.mode === 'template') {
      return templateSlots().map((slot) => draft.slots[slot.id]).filter(Boolean)
    }
    if (draft.mode === 'regions') {
      const filled = []
      const walk = (regions) => {
        for (const region of regions) {
          if (region.fill !== null && region.fill !== undefined) filled.push(region.fill)
          if (Array.isArray(region.children)) walk(region.children)
        }
      }
      walk(draft.regions)
      return filled
    }
    return draft.blocks
  }

  function regionWrapperAttrs(region) {
    const styleBits = []
    const span = Math.max(1, Math.min(12, Math.round(region.width || 12)))
    styleBits.push('--ss-span:' + span)
    const bp = region.breakpoints || {}
    styleBits.push('--ss-span-tablet:' + regionSpan(region, {key:'tablet',cols:6}))
    styleBits.push('--ss-span-mobile:' + regionSpan(region, {key:'mobile',cols:3}))
    styleBits.push('--ss-span-current:' + regionSpan(region, regionConfig()))
    styleBits.push('min-height:' + (!region.fill && !Array.isArray(region.children) ? 88 : 0) + 'px')
    let regionAttrs = ' data-region-id="' + escapeHtml(region.id || '') + '"'
    if (region.newRow) regionAttrs += ' data-newrow="1"'
    if (region.hidden === true) regionAttrs += ' data-hidden="1"'
    if (bp.tablet && bp.tablet.hidden) regionAttrs += ' data-hide-tablet="1"'
    if (bp.mobile && bp.mobile.hidden) regionAttrs += ' data-hide-mobile="1"'
    return { styleAttr: ' style="' + styleBits.join(';') + '"', regionAttrs }
  }

  function atomBlockHtml(block, entryA) {
    let style = block.atom ? block.atom.style || {} : {}
    try { style = JSON.parse(mapColors(JSON.stringify(style), entryA)) } catch {}
    const bits = []
    if (style.background && style.background !== 'rgba(0, 0, 0, 0)') bits.push('background:' + style.background)
    if (style.color) bits.push('color:' + style.color)
    if (style.border && style.border !== 'none') bits.push('border:' + style.border)
    bits.push('border-radius:' + (style.borderRadius || '10px'))
    bits.push('padding:8px 14px')
    bits.push('font-size:' + (style.fontSize || '14px'))
    bits.push('font-weight:' + (style.fontWeight || '500'))
    if (style.fontFamily) bits.push('font-family:' + style.fontFamily)
    if (style.boxShadow) bits.push('box-shadow:' + style.boxShadow)
    return '<div class="ss-atom" style="display:inline-flex;align-items:center;box-sizing:border-box;max-width:100%;overflow-wrap:anywhere;white-space:normal;line-height:1.6;font-family:var(--ss-font-body);' + bits.join(';') + '">' + escapeHtml(block.atom ? block.atom.text || 'Component' : 'Component') + '</div>'
  }

  async function buildRegionExportHtml(region, entryA, cssByCapture, htmlByCapture, classMaps) {
    const { styleAttr, regionAttrs } = regionWrapperAttrs(region)
    if (region.layer === 'overlay') {
      const block = region.fill
      if (block === null || block === undefined) return ''
      const overlay = region.overlay || { x: 8, y: 8, w: 40, z: 3 }
      const overlayStyle = ' style="position:absolute;left:' + (Number(overlay.x) || 0) + '%;top:' + (Number(overlay.y) || 0) + '%;width:' + (Number(overlay.w) || 40) + '%;z-index:' + (Number.isFinite(Number(overlay.z)) ? Number(overlay.z) : 3) + ';min-height:0"'
      const overlayAttrs = regionAttrs
      if (block.type === 'atom') {
        return '<section class="ss-region ss-overlay" data-kind="atom"' + overlayStyle + overlayAttrs + '>' + atomBlockHtml(block, entryA) + '</section>'
      }
      if (block.type === 'image') {
        return '<section class="ss-region ss-overlay" data-kind="image"' + overlayStyle + overlayAttrs + '><img src="' + escapeHtml(block.src || '') + '" alt="" style="max-width:100%;display:block"></section>'
      }
      if (block.type !== 'section') return ''
      if (!cssByCapture.has(block.captureId)) {
        const css = await loadCaptureCss(block.captureId)
        cssByCapture.set(block.captureId, mapColors(css, entryA))
      }
      const html = await loadSectionHtml(block.captureId, block.sectionId)
      const sectionHtml = renameClassesInHtml(mapColors(stripUnsafe(html), entryA), classMaps.get(block.captureId))
      if (!htmlByCapture.has(block.captureId)) htmlByCapture.set(block.captureId, [])
      htmlByCapture.get(block.captureId).push(sectionHtml)
      const scope = typeof block.captureId === 'string' ? ' ss-scope-' + block.captureId : ''
      return '<section class="ss-region ss-overlay' + scope + '" data-kind="' + escapeHtml(block.kindLabel || 'section') + '"' + overlayStyle + overlayAttrs + '>' + sectionHtml + '</section>'
    }
    if (Array.isArray(region.children)) {
      let flowHtml = ''
      let overlayHtml = ''
      for (const child of region.children) {
        const childHtml = await buildRegionExportHtml(child, entryA, cssByCapture, htmlByCapture, classMaps)
        if (child.layer === 'overlay') overlayHtml += childHtml
        else flowHtml += childHtml
      }
      const minHeight = region.children.some(child => child.layer !== 'overlay') ? 0 : (region.height || 300)
      return '<section class="ss-region ss-container"' + styleAttr + regionAttrs + '><div class="ss-region-grid" style="min-height:' + minHeight + 'px">' + flowHtml + '</div>' + overlayHtml + '</section>'
    }
    const block = region.fill
    if (block === null || block === undefined) return '<section class="ss-region"' + styleAttr + regionAttrs + '></section>'
    if (block.type === 'atom') {
      return '<section class="ss-region" data-kind="atom"' + styleAttr + regionAttrs + '>' + atomBlockHtml(block, entryA) + '</section>'
    }
    if (block.type === 'image') {
      return '<section class="ss-region" data-kind="image"' + styleAttr + regionAttrs + '><img src="' + escapeHtml(block.src || '') + '" alt="" style="max-width:100%;display:block"></section>'
    }
    if (block.type !== 'section') return ''
    if (!cssByCapture.has(block.captureId)) {
      const css = await loadCaptureCss(block.captureId)
      cssByCapture.set(block.captureId, mapColors(css, entryA))
    }
    const html = await loadSectionHtml(block.captureId, block.sectionId)
    const sectionHtml = renameClassesInHtml(mapColors(stripUnsafe(html), entryA), classMaps.get(block.captureId))
    if (!htmlByCapture.has(block.captureId)) htmlByCapture.set(block.captureId, [])
    htmlByCapture.get(block.captureId).push(sectionHtml)
    const scopeClass = typeof block.captureId === 'string' ? ' ss-scope-' + block.captureId : ''
    return '<section class="ss-region' + scopeClass + '" data-kind="' + escapeHtml(block.kindLabel || 'section') + '"' + styleAttr + regionAttrs + '>' + sectionHtml + '</section>'
  }

  /* ---------- drag from the library panel into the canvas ---------- */
  let panelDrag = null
  let slotDragId = null
  let layerDrag = null

  function attachPanelDrag(node, item) {
    node.setAttribute('draggable', 'true')
    node.addEventListener('dragstart', (event) => {
      panelDrag = item
      document.body.classList.add('dragging-item')
      try {
        event.dataTransfer.setData('text/plain', item.label || item.type)
        event.dataTransfer.effectAllowed = 'copy'
      } catch {}
    })
    node.addEventListener('dragend', resetDragState)
  }

  function resetDragState() {
    panelDrag = null
    document.body.classList.remove('dragging-item')
    document.querySelectorAll('.drop-ok, .drop-active, .drop-bad').forEach((element) => element.classList.remove('drop-ok', 'drop-active', 'drop-bad'))
  }

  /* Fallback cleanup: some drops (window edge / removed source node) skip dragend. */
  window.addEventListener('dragend', resetDragState, true)
  window.addEventListener('drop', () => setTimeout(resetDragState, 0), true)
  window.addEventListener('blur', () => setTimeout(() => {
    if (document.body.classList.contains('dragging-item')) resetDragState()
  }, 0))

  function itemBlock(item) {
    return {
      id: nextBlockId(),
      type: item.type,
      captureId: item.captureId || null,
      sectionId: item.sectionId || null,
      label: item.label || item.type,
      kindLabel: item.kind || item.kindLabel || item.type,
      bbox: item.bbox || null,
      atom: item.atom || null,
      src: item.src || null,
      ratio: item.ratio || null,
    }
  }

  function slotAccepts(slot, item) {
    if (item === null) return false
    if (item.type !== 'section') return true
    const kinds = Array.isArray(slot.kinds) ? slot.kinds : []
    return kinds.length === 0 || kinds.includes(item.kind)
  }

  function fillSlotWithItem(slotId, item) {
    draft.slots[slotId] = itemBlock(item)
    state.picker = null
    saveDraft()
    setStatus('已填入：' + (item.label || item.type), 'ok')
  }

  function appendBlockFromItem(item) {
    draft.blocks.push(itemBlock(item))
    saveDraft()
    setStatus('已加入画布：' + (item.label || item.type), 'ok')
  }

  /* ---------- region canvas (V3): 2D grid regions with type-aware fills ---------- */
  const ARTBOARDS = {
    desktop: { cols: 12, cls: 'desktop', scale: 1, key: 'desktop' },
    tablet: { cols: 6, cls: 'tablet', scale: 0.7, key: 'tablet' },
    mobile: { cols: 3, cls: 'mobile', scale: 0.5, key: 'mobile' },
  }
  const ARTBOARD_WIDTHS = { desktop: 1440, tablet: 768, mobile: 375 }
  const ARTBOARD_HEIGHTS = { desktop: 900, tablet: 1024, mobile: 812 }
  const REGION_TYPES = {
    nav: { label: '导航', height: 80, sections: ['nav'], atoms: ['按钮', '链接'], image: false },
    hero: { label: 'Hero', height: 600, sections: ['hero', 'section'], atoms: ['标题层级', '按钮', '卡片'], image: true },
    features: { label: '特性区', height: 460, sections: ['features', 'section', 'testimonials'], atoms: ['卡片', '按钮'], image: false },
    pricing: { label: '定价区', height: 420, sections: ['pricing', 'cta', 'section'], atoms: ['卡片', '按钮'], image: false },
    gallery: { label: '画廊', height: 400, sections: ['section', 'features'], atoms: ['卡片'], image: true },
    footer: { label: '页脚', height: 220, sections: ['footer', 'section'], atoms: ['链接'], image: false },
    free: {
      label: '自由区域',
      height: 360,
      sections: ['nav', 'hero', 'features', 'pricing', 'cta', 'testimonials', 'faq', 'section', 'footer'],
      atoms: ['按钮', '输入框', '卡片', '链接', '标题层级'],
      image: true,
    },
    container: { label: '容器（嵌套）', height: 320, sections: [], atoms: [], image: false, container: true },
  }

  function regionConfig() {
    return ARTBOARDS[draft.artboard] || ARTBOARDS.desktop
  }

  function regionSpan(region, config) {
    const override = region.breakpoints && region.breakpoints[config.key]
    if (override !== undefined && override !== null && Number(override.span) > 0) {
      return Math.max(1, Math.min(config.cols, Number(override.span)))
    }
    return Math.max(1, Math.min(config.cols, Math.round(((region.width || 12) * config.cols) / 12)))
  }

  function regionHidden(region, config) {
    const override = region.breakpoints && region.breakpoints[config.key]
    return override !== undefined && override !== null && override.hidden === true
  }

  function setRegionBreakpoint(region, key, patch) {
    if (!region.breakpoints) region.breakpoints = {}
    const next = Object.assign({}, region.breakpoints[key] || {}, patch)
    if (!next.span) delete next.span
    if (next.hidden !== true) delete next.hidden
    if (Object.keys(next).length === 0) delete region.breakpoints[key]
    else region.breakpoints[key] = next
    saveDraft()
  }

  function regionAccepts(region, item) {
    if (item === null || item === undefined) return false
    const preset = REGION_TYPES[region.type] || REGION_TYPES.free
    if (item.type === 'section') return preset.sections.includes(item.kind)
    if (item.type === 'atom') return preset.atoms.includes(item.kind)
    if (item.type === 'image') return preset.image === true
    return false
  }

  function describeItem(item) {
    if (item.type === 'section') return '区块 ' + (item.kind || 'section')
    if (item.type === 'atom') return '组件 ' + (item.kind || 'atom')
    return '图片'
  }

  function presetAcceptsHint(region) {
    const preset = REGION_TYPES[region.type] || REGION_TYPES.free
    const parts = preset.sections.slice(0, 3).concat(preset.atoms.slice(0, 2))
    if (preset.image) parts.push('图片')
    return '收 ' + parts.join(' / ')
  }

  function addSiblingRegion(region, list, side) {
    const targetList = Array.isArray(list) ? list : draft.regions
    const preset = REGION_TYPES[region.type] || REGION_TYPES.free
    const width = Math.max(1, Math.floor((region.width || 12) / 2))
    region.width = width
    region.newRow = false
    const sibling = {
      id: 'reg_' + nextBlockId(),
      type: region.type,
      width,
      height: region.height || preset.height,
      newRow: false,
      fill: null,
      breakpoints: {},
      children: preset.container ? [] : undefined,
    }
    const index = targetList.indexOf(region)
    targetList.splice(side === 'left' ? index : index + 1, 0, sibling)
    saveDraft()
    setStatus('已在' + (side === 'left' ? '左' : '右') + '侧添加半宽区域', 'ok')
  }

  function addRegion(type) {
    if (type === 'overlay') {
      draft.regions.push({
        id: 'reg_' + nextBlockId(),
        type: 'free',
        layer: 'overlay',
        overlay: { x: 8, y: 8, w: 40, z: 3 },
        width: 12,
        height: 280,
        newRow: false,
        fill: null,
        breakpoints: {},
      })
      saveDraft()
      setStatus('已新建叠加层：可拖动位置、改宽度（局部分层，不影响主栅格）', 'ok')
      return
    }
    const preset = REGION_TYPES[type] || REGION_TYPES.free
    draft.regions.push({
      id: 'reg_' + nextBlockId(),
      type: REGION_TYPES[type] ? type : 'free',
      width: 12,
      height: preset.height,
      newRow: false,
      fill: null,
      breakpoints: {},
      children: preset.container ? [] : undefined,
    })
    saveDraft()
    setStatus('已新建区域：' + preset.label, 'ok')
  }

  function addOverlayChild(parent) {
    if (!Array.isArray(parent.children)) parent.children = []
    parent.children.push({
      id: 'reg_' + nextBlockId(),
      type: 'free',
      layer: 'overlay',
      overlay: { x: 8, y: 8, w: 40, z: 3 },
      width: 12,
      height: 240,
      newRow: false,
      fill: null,
      breakpoints: {},
    })
    saveDraft()
    setStatus('已添加叠加层子区域', 'ok')
  }

  function regionTypeForItem(item) {
    if (item.type === 'section') {
      const kind = item.kind || 'section'
      if (REGION_TYPES[kind] !== undefined && REGION_TYPES[kind].container !== true) return kind
      if (kind === 'cta' || kind === 'section') return 'free'
      if (kind === 'testimonials' || kind === 'testimonial') return 'free'
      return 'free'
    }
    if (item.type === 'image') return 'gallery'
    return 'free'
  }

  function nextOverlayZ() {
    let max = 2
    const walk = (regions) => {
      for (const region of regions) {
        if (region.layer === 'overlay') max = Math.max(max, Number(region.overlay && region.overlay.z) || 3)
        if (Array.isArray(region.children)) walk(region.children)
      }
    }
    walk(draft.regions)
    return max + 1
  }

  function overlayPositionFromEvent(event, widthPercent) {
    const board = document.querySelector('#canvas-a .artboard')
    if (board === null || event === undefined || event === null || typeof event.clientX !== 'number') return { x: 8, y: 8 }
    const rect = board.getBoundingClientRect()
    const x = ((event.clientX - rect.left) / Math.max(1, rect.width)) * 100
    const y = ((event.clientY - rect.top) / Math.max(1, rect.height)) * 100
    return {
      x: Math.max(0, Math.min(95, Math.round((x - widthPercent / 2) * 10) / 10)),
      y: Math.max(0, Math.min(95, Math.round(y * 10) / 10)),
    }
  }

  function createRegionFromItem(item, event) {
    /* Atoms / images become local overlay layers: they keep their own size and
     * can be dropped many times without each one claiming a full 12-column row. */
    if (item.type === 'atom' || item.type === 'image') {
      const widthPercent = item.type === 'atom' ? 26 : 34
      let position = overlayPositionFromEvent(event, widthPercent)
      if (event === undefined || event === null) {
        const overlayCount = draft.regions.filter((region) => region.layer === 'overlay').length
        position = { x: 8 + (overlayCount % 4) * 10, y: 8 + (overlayCount % 5) * 8 }
      }
      draft.regions.push({
        id: 'reg_' + nextBlockId(),
        type: 'free',
        layer: 'overlay',
        overlay: { x: position.x, y: position.y, w: widthPercent, z: nextOverlayZ() },
        width: 12,
        height: item.type === 'atom' ? 140 : 240,
        newRow: false,
        fill: itemBlock(item),
        breakpoints: {},
        children: undefined,
      })
      saveDraft()
      setStatus('已作为叠加层放到画布（可拖动位置/右下角缩放，可继续放更多素材）', 'ok')
      return
    }
    const type = regionTypeForItem(item)
    const preset = REGION_TYPES[type] || REGION_TYPES.free
    draft.regions.push({
      id: 'reg_' + nextBlockId(),
      type,
      width: 12,
      height: preset.height,
      newRow: false,
      fill: itemBlock(item),
      breakpoints: {},
      children: undefined,
    })
    saveDraft()
    setStatus('已新建「' + preset.label + '」区域并放入素材', 'ok')
  }

  function addChildRegion(parent) {    if (!Array.isArray(parent.children)) parent.children = []
    parent.children.push({
      id: 'reg_' + nextBlockId(),
      type: 'free',
      width: 12,
      height: 280,
      newRow: false,
      fill: null,
      breakpoints: {},
    })
    saveDraft()
    setStatus('已添加子区域（可在容器内左右排布）', 'ok')
  }

  function moveChildRegion(parent, region, delta) {
    const children = Array.isArray(parent) ? parent : parent.children
    if (!Array.isArray(children)) return
    const from = children.findIndex((item) => item.id === region.id)
    const to = from + delta
    if (from < 0 || to < 0 || to >= children.length) return
    const [item] = children.splice(from, 1)
    children.splice(to, 0, item)
    saveDraft()
  }

  function attachRegionDrop(node, region) {    node.addEventListener('dragover', (event) => {
      if (panelDrag === null) return
      /* Always allow the drop: incompatible items fall back to a new matching region. */
      event.preventDefault()
      if (!regionAccepts(region, panelDrag)) {
        if (!node.classList.contains('drop-bad')) {
          node.classList.add('drop-bad')
          setStatus('「' + (REGION_TYPES[region.type] || REGION_TYPES.free).label + '」区域不收' + describeItem(panelDrag) + '，松开会新建一个「' + (REGION_TYPES[regionTypeForItem(panelDrag)] || REGION_TYPES.free).label + '」区域', 'error')
        }
        return
      }
      node.classList.add('drop-ok')
    })
    node.addEventListener('dragleave', () => {
      node.classList.remove('drop-ok', 'drop-bad')
    })
    node.addEventListener('drop', (event) => {
      if (panelDrag === null) return
      event.preventDefault()
      event.stopPropagation()
      node.classList.remove('drop-ok', 'drop-bad')
      if (!regionAccepts(region, panelDrag)) {
        createRegionFromItem(panelDrag, event)
        return
      }
      region.fill = itemBlock(panelDrag)
      saveDraft()
      setStatus('已放入「' + (REGION_TYPES[region.type] || REGION_TYPES.free).label + '」区域', 'ok')
    })
  }

  function startRegionReorder(event, region, card) {
    event.preventDefault()
    event.stopPropagation()
    const startY = event.clientY
    let active = false
    const board = card.closest('.artboard')
    const grid = card.parentElement
    const line = el('div', { class: 'region-insert-line' })
    const begin = () => {
      active = true
      card.classList.add('dragging')
      if (board !== null) board.classList.add('reordering')
    }
    const move = (moveEvent) => {
      if (!active) {
        if (Math.abs(moveEvent.clientY - startY) < 6) return
        begin()
      }
      const siblings = [...grid.children].filter((node) => node !== card && node.classList.contains('region-card'))
      let target = null
      for (const node of siblings) {
        const rect = node.getBoundingClientRect()
        if (moveEvent.clientY < rect.top + rect.height / 2) {
          target = node
          break
        }
      }
      if (target !== null) grid.insertBefore(line, target)
      else grid.append(line)
    }
    const up = (upEvent) => {
      document.removeEventListener('pointermove', move)
      document.removeEventListener('pointerup', up)
      if (!active) return
      card.classList.remove('dragging')
      if (board !== null) board.classList.remove('reordering')
      line.remove()
      const siblings = [...grid.children].filter((node) => node.classList.contains('region-card') && node !== card)
      let targetIndex = siblings.length
      siblings.forEach((node, index) => {
        if (targetIndex !== siblings.length) return
        const rect = node.getBoundingClientRect()
        if (upEvent.clientY < rect.top + rect.height / 2) targetIndex = index
      })
      const from = draft.regions.findIndex((item) => item.id === region.id)
      if (from < 0) return
      const [item] = draft.regions.splice(from, 1)
      draft.regions.splice(Math.max(0, Math.min(draft.regions.length, targetIndex)), 0, item)
      saveDraft()
    }
    document.addEventListener('pointermove', move)
    document.addEventListener('pointerup', up)
  }

  function startRegionResize(event, region, card, config) {
    event.preventDefault()
    event.stopPropagation()
    const startX = event.clientX
    const startWidth = region.width || 12
    const grid = card.parentElement
    const colWidth = (grid.getBoundingClientRect().width || 1200) / config.cols
    const move = (moveEvent) => {
      const next = Math.max(1, Math.min(12, Math.round(startWidth + (moveEvent.clientX - startX) / colWidth)))
      region.width = next
      card.style.gridColumn = (region.newRow ? '1 / span ' : 'span ') + regionSpan(region, config)
      const meta = card.querySelector('.region-meta')
      if (meta) meta.textContent = (region.fill ? '已填' : '空') + ' · ' + regionSpan(region, config) + '/' + config.cols + ' 列'
    }
    const up = () => {
      document.removeEventListener('pointermove', move)
      document.removeEventListener('pointerup', up)
      saveDraft()
    }
    document.addEventListener('pointermove', move)
    document.addEventListener('pointerup', up)
  }

  function renderRegionBreakpoints(region) {
    const row = el('div', { class: 'region-breakpoints' })
    for (const [key, label, cols] of [['tablet', '平板 768', 6], ['mobile', '手机 375', 3]]) {
      const current = (region.breakpoints && region.breakpoints[key]) || {}
      const select = el('select', { title: label + ' 列宽' })
      select.append(el('option', { value: '', text: '默认' }))
      for (let count = 1; count <= cols; count += 1) {
        select.append(el('option', { value: String(count), text: count + '/' + cols + ' 列' }))
      }
      select.value = current.span ? String(current.span) : ''
      select.addEventListener('change', () => setRegionBreakpoint(region, key, { span: Number(select.value) || undefined }))
      const checkbox = el('input', { type: 'checkbox' })
      checkbox.checked = current.hidden === true
      checkbox.addEventListener('change', () => setRegionBreakpoint(region, key, { hidden: checkbox.checked }))
      row.append(el('span', { text: label }), select, el('label', {}, [checkbox, el('span', { text: '隐藏' })]))
    }
    return row
  }

  function startOverlayDrag(event, region, card) {
    event.preventDefault()
    event.stopPropagation()
    const parent = card.parentElement
    if (parent === null) return
    const rect = parent.getBoundingClientRect()
    const startX = event.clientX
    const startY = event.clientY
    const start = { x: region.overlay.x, y: region.overlay.y }
    const guideV = el('div', { class: 'overlay-guide v' })
    const guideH = el('div', { class: 'overlay-guide h' })
    guideV.style.display = 'none'
    guideH.style.display = 'none'
    parent.append(guideV, guideH)
    const xCandidates = [0, (100 - (region.overlay.w || 40)) / 2, 100 - (region.overlay.w || 40)]
    for (let column = 1; column < 12; column += 1) xCandidates.push(column * (100 / 12))
    const yCandidates = [0, 5, 10, 12.5, 25, 33.33, 50, 66.66, 75, 87.5]
    const snapValue = (value, candidates, threshold) => {
      let best = null
      let bestDelta = threshold
      for (const candidate of candidates) {
        const delta = Math.abs(value - candidate)
        if (delta < bestDelta) {
          bestDelta = delta
          best = candidate
        }
      }
      return best
    }
    const move = (moveEvent) => {
      const rawX = start.x + ((moveEvent.clientX - startX) / Math.max(1, rect.width)) * 100
      const rawY = start.y + ((moveEvent.clientY - startY) / Math.max(1, rect.height)) * 100
      const snappedX = snapValue(rawX, xCandidates, 1.2)
      const snappedY = snapValue(rawY, yCandidates, 1.8)
      region.overlay.x = Math.max(-20, Math.min(95, Math.round((snappedX === null ? rawX : snappedX) * 10) / 10))
      region.overlay.y = Math.max(-20, Math.min(95, Math.round((snappedY === null ? rawY : snappedY) * 10) / 10))
      card.style.left = region.overlay.x + '%'
      card.style.top = region.overlay.y + '%'
      if (snappedX !== null) {
        guideV.style.display = ''
        guideV.style.left = snappedX + '%'
      } else {
        guideV.style.display = 'none'
      }
      if (snappedY !== null) {
        guideH.style.display = ''
        guideH.style.top = snappedY + '%'
      } else {
        guideH.style.display = 'none'
      }
    }
    const up = () => {
      document.removeEventListener('pointermove', move)
      document.removeEventListener('pointerup', up)
      guideV.remove()
      guideH.remove()
      saveDraft()
    }
    document.addEventListener('pointermove', move)
    document.addEventListener('pointerup', up)
  }

  function startOverlayResize(event, region, card) {
    event.preventDefault()
    event.stopPropagation()
    const parent = card.parentElement
    if (parent === null) return
    const rect = parent.getBoundingClientRect()
    const startX = event.clientX
    const startWidth = region.overlay.w
    const candidates = []
    for (let column = 1; column <= 12; column += 1) candidates.push(column * (100 / 12))
    const snapWidth = (value) => {
      let best = null
      let bestDelta = 1.5
      for (const candidate of candidates) {
        const delta = Math.abs(value - candidate)
        if (delta < bestDelta) {
          bestDelta = delta
          best = candidate
        }
      }
      return best
    }
    const move = (moveEvent) => {
      const raw = startWidth + ((moveEvent.clientX - startX) / Math.max(1, rect.width)) * 100
      const snapped = snapWidth(raw)
      region.overlay.w = Math.max(5, Math.min(100, Math.round((snapped === null ? raw : snapped) * 10) / 10))
      card.style.width = region.overlay.w + '%'
    }
    const up = () => {
      document.removeEventListener('pointermove', move)
      document.removeEventListener('pointerup', up)
      saveDraft()
    }
    document.addEventListener('pointermove', move)
    document.addEventListener('pointerup', up)
  }

  function appendRegionContent(body, block, entry, height) {
    if (block.type === 'atom' || block.type === 'image') {
      body.classList.add('region-content')
      if (block.type === 'atom') body.innerHTML = atomBlockHtml(block, entry)
      else body.append(el('img', { src: block.src || '', alt: block.label || '' }))
      return
    }
    const frame = el('iframe', { class:'block-frame', title:block.label || 'fill', sandbox:'allow-same-origin' })
    const capturedHeight = Math.max(40, Math.min(2400, block.bbox?.h || height || 300))
    frame.style.width = '1440px'
    frame.style.height = capturedHeight + 'px'
    body.dataset.blockHeight = String(capturedHeight)
    body.append(frame)
    blockDoc(block, entry).then(doc => { if (frame.isConnected) frame.srcdoc = doc }).catch(() => {})
  }

  function renderOverlayCard(region, entry, list) {
    if (!region.overlay) region.overlay = { x: 8, y: 8, w: 40, z: 3 }
    const overlay = region.overlay
    const card = el('section', { class: 'region-card overlay' + (region.fill ? ' filled' : '') + (region.hidden === true ? ' layer-hidden' : '') })
    if (region.hidden || regionHidden(region, regionConfig())) card.style.display = 'none'
    card.setAttribute('data-layer-id', 'region:' + region.id)
    card.style.position = 'absolute'
    card.style.left = (Number(overlay.x) || 0) + '%'
    card.style.top = (Number(overlay.y) || 0) + '%'
    card.style.width = (Number(overlay.w) || 40) + '%'
    card.style.zIndex = String(Number.isFinite(Number(overlay.z)) ? Number(overlay.z) : 3)
    card.style.minHeight = '0px'
    const meta = el('span', { class: 'region-meta', text: (region.fill ? '已填' : '空') + ' · 叠加 ' + (Number(overlay.w) || 40) + '%' })
    const head = el('div', { class: 'region-head' }, [
      el('span', { class: 'region-grip', text: '⤧', title: '拖动位置' }),
      el('span', { class: 'region-type', text: '叠加层' }),
      meta,
    ])
    if (region.hidden === true) head.append(el('span', { class: 'bp-badge', text: '已隐藏' }))
    head.append(el('span', { class: 'region-actions' }, [
      el('button', { type: 'button', class: 'mini', text: '断点', onclick: () => { state.breakpointEdit = state.breakpointEdit === region.id ? null : region.id; renderCanvas() } }),
      el('button', { type: 'button', class: 'mini', text: '清除', onclick: () => { region.fill = null; saveDraft() } }),
      el('button', { type: 'button', class: 'mini', text: '删除', onclick: () => {
        const parentList = Array.isArray(list) ? list : draft.regions
        const index = parentList.indexOf(region)
        if (index >= 0) parentList.splice(index, 1)
        saveDraft()
      } }),
    ]))
    head.addEventListener('pointerdown', (event) => {
      if (event.target !== null && typeof event.target.closest === 'function' && event.target.closest('button') !== null) return
      state.selectedLayer = 'region:' + region.id
      applyLayerSelection()
      renderPanel(selectedEntry())
      startOverlayDrag(event, region, card)
    })
    card.append(head)
    if (state.breakpointEdit === region.id) card.append(renderRegionBreakpoints(region))
    const body = el('div', { class: 'region-body' })
    if (region.fill) {
      appendRegionContent(body, region.fill, entry, region.height)
    } else {
      body.append(el('div', { class: 'region-empty', text: '把素材拖进叠加层（绝对定位，局部叠放）' }))
    }
    card.append(body)
    attachRegionDrop(card, region)
    const resize = el('span', { class: 'region-resize', title: '拖动改变宽度 %' })
    resize.addEventListener('pointerdown', (event) => startOverlayResize(event, region, card))
    card.append(resize)
    return card
  }

  function renderRegionCard(region, index, config, entry, list, isChild = false) {
    const preset = REGION_TYPES[region.type] || REGION_TYPES.free
    const isContainer = preset.container === true || Array.isArray(region.children)
    const hiddenHere = regionHidden(region, config)
    const card = el('section', { class: 'region-card' + (region.fill ? ' filled' : '') + (hiddenHere ? ' bp-hidden' : '') + (isContainer ? ' container' : '') + (isChild ? ' child' : '') + (region.hidden === true ? ' layer-hidden' : '') })
    if (region.hidden || hiddenHere) card.style.display = 'none'
    card.setAttribute('data-layer-id', 'region:' + region.id)
    if (region.hidden === true) card.classList.add('layer-hidden')
    card.style.gridColumn = (region.newRow ? '1 / span ' : 'span ') + regionSpan(region, config)
    card.style.minHeight = isContainer ? '0px' : region.fill ? '0px' : '88px'
    const grip = el('span', { class: 'region-grip', text: '⋮⋮', title: isChild ? '用 ↑↓ 调整顺序' : '拖动排序' })
    if (!isChild) grip.addEventListener('pointerdown', (event) => startRegionReorder(event, region, card))
    const meta = el('span', { class: 'region-meta' })
    const metaText = () => {
      if (isContainer) return '容器 · ' + (Array.isArray(region.children) ? region.children.length : 0) + ' 个子区域'
      const parts = [(region.fill ? '已填' : '空') + ' · ' + regionSpan(region, config) + '/' + config.cols + ' 列']
      if (hiddenHere) parts.push('本断点隐藏')
      return parts.join(' · ')
    }
    meta.textContent = metaText()
    const head = el('div', { class: 'region-head' }, [
      grip,
      el('span', { class: 'region-type', text: preset.label }),
      meta,
    ])
    if (hiddenHere) head.append(el('span', { class: 'bp-badge', text: '隐藏' }))
    if (region.hidden === true) head.append(el('span', { class: 'bp-badge', text: '已隐藏' }))
    head.addEventListener('click', (event) => {
      if (event.target !== null && typeof event.target.closest === 'function' && event.target.closest('button') !== null) return
      selectLayer('region:' + region.id)
    })
    if (!isChild) {
      head.style.cursor = 'grab'
      head.addEventListener('pointerdown', (event) => {
        if (event.target !== null && typeof event.target.closest === 'function' && event.target.closest('button, input, select') !== null) return
        startRegionReorder(event, region, card)
      })
    }
    card.addEventListener('click', (event) => {
      if (event.target !== null && typeof event.target.closest === 'function' && event.target.closest('button, a, input, select, iframe') !== null) return
      selectLayer('region:' + region.id)
    })
    const actions = el('span', { class: 'region-actions' })
    if (isChild) {
      actions.append(
        el('button', { type: 'button', class: 'mini', text: '↑', title: '上移', onclick: () => moveChildRegion(list, region, -1) }),
        el('button', { type: 'button', class: 'mini', text: '↓', title: '下移', onclick: () => moveChildRegion(list, region, 1) }),
      )
    }
    if (isContainer) {
      actions.append(el('button', { type: 'button', class: 'mini', text: '＋子区域', onclick: () => addChildRegion(region) }))
      actions.append(el('button', { type: 'button', class: 'mini', text: '＋叠加层', onclick: () => addOverlayChild(region) }))
      actions.append(el('button', { type: 'button', class: 'mini', text: '删除', onclick: () => { const target = list || draft.regions; target.splice(target.indexOf(region), 1); saveDraft() } }))
    } else {
      actions.append(
        el('button', { type: 'button', class: 'mini' + (state.breakpointEdit === region.id ? ' on' : ''), text: '断点', onclick: () => { state.breakpointEdit = state.breakpointEdit === region.id ? null : region.id; renderCanvas() } }),
        el('button', { type: 'button', class: 'mini', text: '＋左', title: '在左侧添加半宽区域', onclick: () => addSiblingRegion(region, list || draft.regions, 'left') }),
        el('button', { type: 'button', class: 'mini', text: '＋右', title: '在右侧添加半宽区域', onclick: () => addSiblingRegion(region, list || draft.regions, 'right') }),
        el('button', { type: 'button', class: 'mini', text: '清除', onclick: () => { region.fill = null; saveDraft() } }),
        el('button', { type: 'button', class: 'mini', text: '复制', onclick: () => {
          const target = list || draft.regions
          const copy = JSON.parse(JSON.stringify(region))
          copy.id = 'reg_' + nextBlockId()
          target.splice(target.indexOf(region) + 1, 0, copy)
          saveDraft()
        } }),
      )
      if (!isChild) actions.append(el('button', { type: 'button', class: 'mini', text: '换行', onclick: () => { region.newRow = true; saveDraft() } }))
      actions.append(el('button', { type: 'button', class: 'mini', text: '删除', onclick: () => { const target = list || draft.regions; target.splice(target.indexOf(region), 1); saveDraft() } }))
    }
    head.append(actions)
    card.append(head)
    if (state.breakpointEdit === region.id) card.append(renderRegionBreakpoints(region))
    const body = el('div', { class: 'region-body' })
    if (isContainer) {
      const grid = el('div', { class: 'region-grid nested', style: { gridTemplateColumns: 'repeat(' + config.cols + ', minmax(0, 1fr))' } })
      const children = Array.isArray(region.children) ? region.children : []
      const flowChildren = children.filter((child) => child.layer !== 'overlay')
      const overlayChildren = children.filter((child) => child.layer === 'overlay')
      if (flowChildren.length === 0) {
        grid.style.minHeight = (region.height || 300) + 'px'
        if (overlayChildren.length === 0) grid.append(el('div', { class: 'region-empty', text: '点「＋子区域」添加，再把素材拖进子区域；子区域可左右排布。' }))
      }
      flowChildren.forEach((child, childIndex) => grid.append(renderRegionCard(child, childIndex, config, entry, region.children, true)))
      body.append(grid)
      overlayChildren.forEach((child) => body.append(renderOverlayCard(child, entry, region.children)))
    } else if (region.fill) {
      appendRegionContent(body, region.fill, entry, region.height)
    } else {
      body.append(el('div', { class: 'region-empty', text: '把素材拖进「' + preset.label + '」区域（' + presetAcceptsHint(region) + '）' }))
    }
    card.append(body)
    if (!isContainer) attachRegionDrop(card, region)
    const resize = el('span', { class: 'region-resize', title: '拖动改变列宽' })
    resize.addEventListener('pointerdown', (event) => startRegionResize(event, region, card, config))
    card.append(resize)
    return card
  }

  function renderRegionCanvas(container, entry) {
    container.textContent = ''
    if (state.layoutImport) container.append(renderLayoutImportPanel())
    if (state.aiPrompt) container.append(renderAiPromptPanel(entry))
    const config = regionConfig()
    const board = el('div', { class: 'artboard ' + config.cls })
    for (const [key, value] of Object.entries(pageThemeVars(entry))) board.style.setProperty(key, value)
    board.style.background = 'var(--ss-bg)'
    board.style.color = 'var(--ss-text)'
    board.style.fontFamily = 'var(--ss-font-body)'
    const grid = el('div', { class: 'region-grid', style: { gridTemplateColumns: 'repeat(' + config.cols + ', minmax(0, 1fr))' } })
    if (draft.regions.length === 0) {
      grid.append(el('div', { class: 'canvas-empty', text: '把左侧的单个组件 / 图片 / 图标拖到这里组成页面；区块只作整段参考，不再直接放入画布。' }))
    }
    const flowRegions = draft.regions.filter((region) => region.layer !== 'overlay')
    const overlayRegions = draft.regions.filter((region) => region.layer === 'overlay')
    flowRegions.forEach((region, index) => grid.append(renderRegionCard(region, index, config, entry, draft.regions, false)))
    /* Drop on empty canvas area -> create a matching region and fill it. */
    grid.addEventListener('dragover', (event) => {
      if (panelDrag === null) return
      event.preventDefault()
      board.classList.add('drop-active')
    })
    grid.addEventListener('dragleave', () => board.classList.remove('drop-active'))
    grid.addEventListener('click', (event) => {
      if (event.target !== grid && !(event.target.classList && event.target.classList.contains('canvas-empty'))) return
      state.selectedLayer = null
      applyLayerSelection()
      renderPanel(selectedEntry())
    })
    grid.addEventListener('drop', (event) => {
      if (panelDrag === null) return
      event.preventDefault()
      board.classList.remove('drop-active')
      createRegionFromItem(panelDrag, event)
    })
    board.append(grid)
    overlayRegions.forEach((region) => board.append(renderOverlayCard(region, entry, draft.regions)))
    container.append(board)
    const b = $('canvas-b')
    if (b) b.style.display = 'none'
  }

  /* ---------- layout JSON (AI zoning) ---------- */
  function fillSpecOf(block) {
    if (block === null || block === undefined) return null
    const spec = {
      id: block.id,
      type: block.type,
      captureId: block.captureId || null,
      sectionId: block.sectionId || null,
      label: block.label,
      kindLabel: block.kindLabel,
      bbox: block.bbox || null,
    }
    if (block.type === 'atom') spec.atom = block.atom
    if (block.type === 'image') {
      spec.src = block.src || null
      spec.ratio = block.ratio || null
    }
    return spec
  }

  function toLayerNode(region) {
    const isGroup = Array.isArray(region.children)
    return {
      id: region.id,
      kind: isGroup ? 'group' : 'asset',
      role: region.layer === 'overlay' ? 'absolute' : 'flow',
      type: region.type,
      span: region.width || 12,
      height: region.height ?? 300,
      newRow: region.newRow === true,
      hidden: region.hidden === true,
      breakpoints: region.breakpoints && Object.keys(region.breakpoints).length > 0 ? region.breakpoints : undefined,
      overlay: region.layer === 'overlay' ? region.overlay : undefined,
      asset: fillSpecOf(region.fill),
      children: isGroup ? region.children.map(toLayerNode) : undefined,
    }
  }

  function layoutItemFromLayer(layer) {
    if (!layer || typeof layer !== 'object') return null
    return {
      id: layer.id,
      hidden: layer.hidden === true,
      type: layer.type || (layer.kind === 'group' ? 'container' : 'free'),
      width: Number(layer.span) || Number(layer.width) || 12,
      height: layer.height ?? 300,
      newRow: layer.newRow === true,
      layer: layer.role === 'absolute' ? 'overlay' : undefined,
      overlay: layer.overlay,
      breakpoints: layer.breakpoints,
      fill: layer.asset || layer.fill || null,
      children: Array.isArray(layer.children) ? layer.children.map(layoutItemFromLayer) : undefined,
    }
  }

  function buildLayoutJson() {
    return {
      schema: 'style-scout/layer@1',
      name: '区域布局',
      artboard: draft.artboard || 'desktop',
      background: draft.background,
      theme: draft.theme,
      layers: draft.regions.map(toLayerNode),
    }
  }

  async function syncLayoutToHost(data) {
    try {
      await api('/style-scout/api/layouts', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: data.name, layout: data }),
      })
    } catch { /* host route may be older; download already succeeded */ }
  }

  function exportLayout() {
    const data = buildLayoutJson()
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    const anchor = document.createElement('a')
    anchor.href = url
    anchor.download = 'style-scout-layout.json'
    document.body.append(anchor)
    anchor.click()
    anchor.remove()
    setTimeout(() => URL.revokeObjectURL(url), 2000)
    syncLayoutToHost(data)
    setStatus('已导出布局 JSON（并尝试同步到 host）', 'ok')
  }

  async function loadHostLayouts() {
    try {
      const data = await api('/style-scout/api/layouts')
      state.hostLayouts = Array.isArray(data.layouts) ? data.layouts : []
    } catch {
      state.hostLayouts = []
    }
  }

  async function applyLayoutJson(raw) {
    if (state.entries.length === 0) {
      try { await loadLibrary() } catch { /* keep going; fills will be reported as unresolved */ }
    }
    const items = raw !== null && typeof raw === 'object'
      ? (Array.isArray(raw.layers) ? raw.layers.map(layoutItemFromLayer) : Array.isArray(raw.regions) ? raw.regions : null)
      : null
    if (items === null) {
      setStatus('布局没有 layers/regions', 'error')
      return
    }
    const fillFromSpec = (spec) => {
      if (spec === null || typeof spec !== 'object') return { block: null, unresolved: false }
      if (typeof spec.assetId === 'string') {
        let found = null
        for (const entry of state.entries) {
          const index = assetsIndexOf(entry)
          if (index === null) continue
          found = index.assets.find((asset) => asset.id === spec.assetId) || null
          if (found !== null) break
        }
        const block = blockFromAsset(found)
        return { block, unresolved: block === null }
      }
      if (spec.type === 'atom') {
        return {
          block: {
            id: nextBlockId(),
            type: 'atom',
            captureId: spec.captureId || null,
            label: spec.label || '组件',
            kindLabel: spec.kindLabel || spec.source?.atomType || '按钮',
            atom: spec.atom || { text: spec.source?.text || '', style: spec.source?.style || {} },
          },
          unresolved: false,
        }
      }
      if (spec.type === 'image') {
        return {
          block: {
            id: nextBlockId(),
            type: 'image',
            captureId: spec.captureId || null,
            label: spec.label || '图片',
            kindLabel: spec.kindLabel || '图片',
            src: spec.src || null,
            ratio: spec.ratio || null,
          },
          unresolved: false,
        }
      }
      if (typeof spec.captureId !== 'string') return { block: null, unresolved: false }
      const entry = state.entries.find((candidate) => candidate.id === spec.captureId)
      const section = entry && (entry.sections || []).find((candidate) => candidate.id === spec.sectionId)
      if (entry === undefined || section === undefined) return { block: null, unresolved: true }
      return {
        block: {
          id: nextBlockId(),
          type: 'section',
          captureId: entry.id,
          sectionId: section.id,
          label: (entry.label || entry.id) + ' · ' + (section.kind || 'section'),
          kindLabel: section.kind || 'section',
          bbox: section.bbox || null,
        },
        unresolved: false,
      }
    }
    let filled = 0
    const problems = []
    const ids = new Set()
    const numberOr = (value, fallback) => value !== null && value !== '' && Number.isFinite(Number(value)) ? Number(value) : fallback
    const convert = (item, label, depth = 0) => {
      if (!item || typeof item !== 'object' || !REGION_TYPES[item.type] || depth > 32) {
        problems.push(label + '：区域类型或嵌套层数不支持')
        return null
      }
      const id = typeof item.id === 'string' && item.id ? item.id : 'reg_' + nextBlockId()
      if (ids.has(id)) problems.push(label + '：名称重复')
      ids.add(id)
      const region = {
        id, type: item.type,
        width: Math.max(1, Math.min(12, numberOr(item.width, 12))),
        height: Math.max(0, numberOr(item.height, 300)),
        newRow: item.newRow === true,
        hidden: item.hidden === true,
        breakpoints: {}, fill: null,
      }
      for (const key of ['tablet', 'mobile']) {
        const bp = item.breakpoints && item.breakpoints[key]
        if (!bp || typeof bp !== 'object') continue
        region.breakpoints[key] = { ...bp }
      }
      if (item.layer === 'overlay') {
        region.layer = 'overlay'
        const o = item.overlay || {}
        region.overlay = { x: numberOr(o.x, 8), y: numberOr(o.y, 8), w: Math.max(5, Math.min(100, numberOr(o.w, 40))), z: numberOr(o.z, 3) }
      }
      const result = fillFromSpec(item.fill)
      if (result.unresolved || (item.fill && !result.block)) problems.push(label + '：素材缺失或尚不支持')
      if (result.block) { region.fill = result.block; filled += 1 }
      if ((Array.isArray(item.children) || REGION_TYPES[item.type].container) && (item.layer === 'overlay' || item.fill)) {
        problems.push(label + '：容器本身暂不能叠放或同时填入素材；请在容器内添加子元素')
      }
      if (Array.isArray(item.children)) {
        region.children = item.children.map((child, index) => convert(child, label + '/' + (index + 1), depth + 1)).filter(Boolean)
      } else if (REGION_TYPES[item.type].container) region.children = []
      return region
    }
    const regions = items.map((item, index) => convert(item, '区域 ' + (index + 1))).filter(Boolean)
    if (problems.length) {
      setStatus('未导入，原画布保留：' + problems.slice(0, 3).join('；'), 'error')
      return false
    }
    draft.background = typeof raw.background === 'string' ? raw.background : undefined
    draft.theme = raw.theme && typeof raw.theme === 'object' ? JSON.parse(JSON.stringify(raw.theme)) : undefined
    draft.mode = 'regions'
    draft.artboard = ['desktop', 'tablet', 'mobile'].includes(raw.artboard) ? raw.artboard : 'desktop'
    draft.regions = regions
    state.layoutImport = false
    saveDraft()
    setStatus('已导入布局：' + (raw.name || '区域布局') + '（' + regions.length + ' 个区域，填入 ' + filled + ' 个）', 'ok')
    return true
  }

  function assetCatalogForPrompt(entry) {
    const index = assetsIndexOf(entry)
    if (index !== null) {
      return index.assets.map((asset) => {
        const source = asset.source || {}
        return {
          id: asset.id,
          kind: asset.kind,
          group: asset.group,
          label: asset.label,
          text: (asset.text || source.text || '').slice(0, 80),
          size: asset.bbox ? { w: asset.bbox.w, h: asset.bbox.h } : (source.w || source.h ? { w: source.w || null, h: source.h || null } : null),
        }
      })
    }
    const assets = []
    for (const section of entry.sections || []) {
      assets.push({ id: 'section_' + section.id, kind: 'section', group: 'section', label: (entry.label || entry.id) + ' · ' + (section.kind || 'section'), text: (section.text || '').slice(0, 80), size: section.bbox || null })
    }
    const groups = [
      ['button', '按钮', entry.components && entry.components.buttons],
      ['input', '输入框', entry.components && entry.components.inputs],
      ['card', '卡片', entry.components && entry.components.cards],
      ['link', '链接', entry.components && entry.components.links],
      ['heading', '标题层级', entry.components && entry.components.headings],
    ]
    for (const [kind, label, items] of groups) {
      (items || []).forEach((item, index) => {
        assets.push({ id: `atom_${kind}_${index}`, kind, group: 'component', label: label + ' ' + (item.text || index + 1), text: (item.text || '').slice(0, 80), size: null })
      })
    }
    ;(entry.assets && entry.assets.images || []).forEach((image, index) => {
      assets.push({ id: `image_${index}`, kind: 'image', group: 'media', label: image.alt || image.src || 'image', text: '', size: image.w && image.h ? { w: image.w, h: image.h } : null })
    })
    return assets
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text)
      setStatus('已复制到剪贴板', 'ok')
      return
    } catch {}
    const area = document.createElement('textarea')
    area.value = text
    area.style.cssText = 'position:fixed;left:-9999px;top:0'
    document.body.append(area)
    area.select()
    try {
      document.execCommand('copy')
      setStatus('已复制到剪贴板', 'ok')
    } catch {
      setStatus('复制失败：请手动全选文本复制', 'error')
    }
    area.remove()
  }

  function renderSlotRow(slot, entry, side, index) {
    const block = draft.slots[slot.id]
    const row = el('div', { class: 'slot' + (block ? ' filled' : ''), 'data-layer-id': 'slot:' + slot.id })
    if (state.selectedLayer === 'slot:' + slot.id) row.classList.add('selected')
    const grip = el('span', { class: 'slot-grip', title: '拖动移动位置', text: '⋮⋮' })
    grip.setAttribute('draggable', 'true')
    grip.addEventListener('dragstart', (event) => {
      slotDragId = slot.id
      row.classList.add('dragging')
      try {
        event.dataTransfer.setData('text/plain', slot.id)
        event.dataTransfer.effectAllowed = 'move'
      } catch {}
    })
    grip.addEventListener('dragend', () => {
      slotDragId = null
      row.classList.remove('dragging')
      document.querySelectorAll('.drop-ok').forEach((element) => element.classList.remove('drop-ok'))
    })
    const head = el('div', { class: 'slot-head' }, [
      grip,
      el('span', { class: 'slot-num', text: String(index + 1).padStart(2, '0') }),
      el('span', { class: 'slot-label', text: slot.label }),
      el('span', { class: 'slot-hint', text: slot.hint || '' }),
      el('span', { class: 'slot-state', text: block ? '已填' : '空' }),
    ])
    if (side === 'a') {
      head.append(el('span', { class: 'slot-actions' }, [
        el('button', { type: 'button', class: 'mini', text: block ? '更换' : '选择', onclick: () => { state.picker = { slotId: slot.id, kinds: slot.kinds }; renderCanvas() } }),
        block ? el('button', { type: 'button', class: 'mini', text: '清除', onclick: () => { delete draft.slots[slot.id]; saveDraft() } }) : null,
        el('button', { type: 'button', class: 'mini' + (state.slotEdit === slot.id ? ' on' : ''), title: '样式微调', text: '⚙', onclick: () => { state.slotEdit = state.slotEdit === slot.id ? null : slot.id; renderCanvas() } }),
        slot.custom ? el('button', { type: 'button', class: 'mini', text: '删空位', onclick: () => { removeCustomSlot(slot.id) } }) : null,
      ].filter(Boolean)))
    }
    row.append(head)
    const slotStyle = slotStyleOf(slot.id)
    if (state.slotEdit === slot.id) {
      const styleRow = el('div', { class: 'slot-style' })
      styleRow.append(el('span', { text: '间距' }))
      for (const pad of [0, 8, 16, 24]) {
        styleRow.append(el('button', { type: 'button', class: 'mini' + (slotStyle.pad === pad ? ' on' : ''), text: pad + 'px', onclick: () => updateSlotStyle(slot.id, { pad }) }))
      }
      styleRow.append(el('span', { text: '背景' }))
      for (const [bg, label] of [['transparent', '透明'], ['surface', '表面'], ['accent', '强调']]) {
        styleRow.append(el('button', { type: 'button', class: 'mini' + (slotStyle.bg === bg ? ' on' : ''), text: label, onclick: () => updateSlotStyle(slot.id, { bg }) }))
      }
      row.append(styleRow)
    }
    if (side === 'a') {
      row.addEventListener('dragover', (event) => {
        if (slotDragId !== null && slotDragId !== slot.id) {
          event.preventDefault()
          row.classList.add('drop-ok')
          return
        }
        if (panelDrag === null || !slotAccepts(slot, panelDrag)) return
        event.preventDefault()
        row.classList.add('drop-ok')
      })
      row.addEventListener('dragleave', () => row.classList.remove('drop-ok'))
      row.addEventListener('drop', (event) => {
        if (slotDragId !== null && slotDragId !== slot.id) {
          event.preventDefault()
          event.stopPropagation()
          row.classList.remove('drop-ok')
          moveSlotToIndex(slotDragId, index)
          slotDragId = null
          return
        }
        if (panelDrag === null || !slotAccepts(slot, panelDrag)) return
        event.preventDefault()
        event.stopPropagation()
        row.classList.remove('drop-ok')
        fillSlotWithItem(slot.id, panelDrag)
      })
    }
    if (block) {
      const body = el('div', { class: 'slot-body', style: { padding: slotStyle.pad + 'px', background: slotBgCss(slotStyle.bg) } })
      const frame = el('iframe', { class: 'block-frame', title: block.label || 'block', sandbox: 'allow-same-origin' })
      const capturedHeight = Math.max(40, Math.min(2400, (block.bbox && block.bbox.h) || 400))
      frame.style.width = '1440px'
      frame.style.height = capturedHeight + 'px'
      body.dataset.blockHeight = String(capturedHeight)
      body.append(frame)
      blockDoc(block, entry).then((doc) => { if (frame.isConnected) frame.srcdoc = doc }).catch(() => {})
      row.append(body)
    } else {
      const empty = el('div', { class: 'slot-empty' }, [
        el('span', { class: 'plus', text: '＋' }),
        el('span', { text: '点这里挑一个「' + slot.label + '」区块' }),
      ])
      if (side === 'a') empty.addEventListener('click', () => { state.picker = { slotId: slot.id, kinds: slot.kinds }; renderCanvas() })
      row.append(empty)
    }
    return row
  }

  function renderPicker(entryA) {

    const slot = templateSlots().find((item) => item.id === state.picker.slotId)
    panel.append(el('div', { class: 'picker-head' }, [

    ]))

    const candidates = candidatesForSlot(slot || { kinds: [] })

      grid.append(el('div', { class: 'empty', text: '资产库里还没有区块。先采集一个页面。' }))

  function renderGap(index) {
    const gap = el('div', { class: 'slot-gap', title: '拖到这里插入空位' })
    gap.addEventListener('dragover', (event) => {
      if (panelDrag === null && slotDragId === null) return
      event.preventDefault()
      gap.classList.add('drop-ok')
    })
    gap.addEventListener('dragleave', () => gap.classList.remove('drop-ok'))
    gap.addEventListener('drop', (event) => {
      event.preventDefault()
      event.stopPropagation()
      gap.classList.remove('drop-ok')
      if (slotDragId !== null) {
        moveSlotToIndex(slotDragId, index)
        slotDragId = null
        return
      }
      if (panelDrag !== null) insertSlotFromItem(index, panelDrag)
