  }

  function renderTemplateCanvas(a, b, entryA, entryB) {
    a.textContent = ''
    b.textContent = ''
    if (state.picker) a.append(renderPicker(entryA))
    if (state.templateImport) a.append(renderTemplateImportPanel())
    const slots = templateSlots()
    const build = (container, side, entry) => {
      slots.forEach((slot, index) => {
        if (side === 'a') container.append(renderGap(index))
        container.append(renderSlotRow(slot, entry, side, index))
      })
      if (side === 'a') container.append(renderGap(slots.length))
    }
    if (draft.split) {
      const colA = el('div', { class: 'slot-col' })
      const colB = el('div', { class: 'slot-col' })
      build(colA, 'a', entryA)
      build(colB, 'b', entryB)
      a.append(colA)
      b.append(colB)
    } else {
      const col = el('div', { class: 'slot-col' })
      build(col, 'a', entryA)
      a.append(col)
    }
  }

  function applyArtboardSize() {
    const width = ARTBOARD_WIDTHS[draft.artboard] || 1440
    const height = ARTBOARD_HEIGHTS[draft.artboard] || 900
    document.querySelectorAll('#canvas-a .artboard, #canvas-b .artboard').forEach((board) => {
      board.style.width = width + 'px'
      board.style.maxWidth = 'none'
      board.style.height = height + 'px'
      board.style.minHeight = height + 'px'
      board.style.overflow = 'auto'
      board.dataset.size = (draft.artboard === 'tablet' ? '平板' : draft.artboard === 'mobile' ? '手机' : '桌面') + ' ' + width + ' × ' + height
    })
  }

  function fitZoom() {
    const width = ARTBOARD_WIDTHS[draft.artboard] || 1440
    const scroll = $('canvas-scroll')
    const available = scroll ? scroll.clientWidth - 48 : width
    return Math.max(0.25, Math.min(1, Math.round((available / width) * 100) / 100))
  }

  function applyCanvasZoom() {
    const zoom = state.canvasZoom > 0 ? state.canvasZoom : 1
    state.canvasZoom = zoom
    document.querySelectorAll('#canvas-a .artboard, #canvas-b .artboard').forEach((board) => {
      board.style.zoom = String(zoom)
    })
    const label = $('zoom-label')
    if (label) label.textContent = Math.round(zoom * 100) + '%'
    const wheel = $('zoom-wheel')
    if (wheel) wheel.classList.toggle('on', state.wheelZoom === true)
    try { localStorage.setItem('ss.zoom.v2', String(zoom)) } catch {}
  }

  function setCanvasZoom(next) {
    state.canvasZoom = Math.max(0.25, Math.min(3, Math.round(next * 100) / 100))
    applyCanvasZoom()
  }

  function renderCanvas() {
    const a = $('canvas-a')
    const b = $('canvas-b')
    if (!a || !b) return
    const entryA = resolveSkin(draft.skinA) || selectedEntry()
    const entryB = resolveSkin(draft.skinB) || entryA
    $('canvas-b').style.display = draft.split ? '' : 'none'
    if (draft.mode === 'regions') {
      renderRegionCanvas(a, entryA)
    } else if (draft.mode === 'template') {
      renderTemplateCanvas(a, b, entryA, entryB)
    } else {
      a.textContent = ''
      b.textContent = ''
      if (draft.blocks.length === 0) {
        a.append(el('div', { class: 'canvas-empty', text: '画布是空的：在左侧「素材」里拖到画布，或点「＋ 画布」添加。' }))
        if (draft.split) b.append(el('div', { class: 'canvas-empty', text: 'B 皮肤预览' }))
      } else {
        for (const block of draft.blocks) {
          a.append(renderBlock(block, entryA, 'a'))
          if (draft.split) b.append(renderBlock(block, entryB, 'b'))
        }
      }
    }
    updateCanvasHead()
    syncCompTabs(selectedEntry())
    applyArtboardSize()
    applyCanvasZoom()
    requestAnimationFrame(fitBlocks)
  }

  /* ---------- export assembled page (V2-4) ---------- */
  async function exportPage(mode) {
    if (activeBlocks().length === 0) {
      setStatus('画布为空，先添加区块或组件', 'error')
      return
    }
    const entryA = resolveSkin(draft.skinA) || selectedEntry()
    if (!entryA) {
      setStatus('先选择一份采集作为皮肤', 'error')
      return
    }
    setStatus('正在生成拼装页…')
    const cssByCapture = new Map()
    const htmlByCapture = new Map()
    const classMaps = new Map()
    const usedSections = new Map()
    const collectBlock = (block) => {
      if (block === null || block === undefined) return
      if (block.type !== 'section' || typeof block.captureId !== 'string' || typeof block.sectionId !== 'string') return
      if (!usedSections.has(block.captureId)) usedSections.set(block.captureId, new Set())
      usedSections.get(block.captureId).add(block.sectionId)
    }
    const collectRegion = (region) => {
      if (region.fill !== null && region.fill !== undefined) collectBlock(region.fill)
      if (Array.isArray(region.children)) region.children.forEach(collectRegion)
    }
    if (draft.mode === 'regions') {
      draft.regions.forEach(collectRegion)
    } else {
      const blocks = draft.mode === 'template'
        ? templateSlots().map((slot) => draft.slots[slot.id]).filter(Boolean)
        : draft.blocks
      blocks.forEach(collectBlock)
    }
    for (const [captureId, sectionIds] of usedSections) {
      const snippets = []
      for (const sectionId of sectionIds) snippets.push(await loadSectionHtml(captureId, sectionId))
      classMaps.set(captureId, buildClassMap(captureId, snippets))
    }
    const blocksHtml = []
    const overlayBlocksHtml = []
    const componentFiles = {}
    let componentIndex = 0
    const atomSnippet = (block) => atomBlockHtml(block, entryA)
    const exportItems = draft.mode === 'template'
      ? templateSlots().map((slot) => ({ slot, block: draft.slots[slot.id] })).filter((item) => item.block !== undefined)
      : draft.mode === 'regions'
        ? draft.regions.map((region) => ({ region }))
        : draft.blocks.map((block) => ({ slot: null, block }))
    for (const item of exportItems) {
      const block = item.block
      const region = item.region || null
      if (region) {
        ;(region.layer === 'overlay' ? overlayBlocksHtml : blocksHtml).push(await buildRegionExportHtml(region, entryA, cssByCapture, htmlByCapture, classMaps))
        continue
      }
      const slotStyle = item.slot ? slotStyleOf(item.slot.id) : { pad: 0, bg: 'transparent' }
      const styleBits = []
      if (slotStyle.pad > 0) styleBits.push('padding:' + slotStyle.pad + 'px')
      if (slotStyle.bg === 'surface') styleBits.push('background:var(--ss-surface)')
      if (slotStyle.bg === 'accent') styleBits.push('background:#eef2ff')
      const regionAttrs = ''
      const styleAttr = styleBits.length > 0 ? ' style="' + styleBits.join(';') + '"' : ''
      const sectionClass = region ? 'ss-region' : 'ss-block'
      const scopeClass = block.type === 'section' && typeof block.captureId === 'string' ? ' ss-scope-' + block.captureId : ''
      const sectionOpen = '<section class="' + sectionClass + scopeClass + '"'
      if (block.type === 'section') {
        if (!cssByCapture.has(block.captureId)) {
          const css = await loadCaptureCss(block.captureId)
          cssByCapture.set(block.captureId, mapColors(css, entryA))
        }
        const html = await loadSectionHtml(block.captureId, block.sectionId)
        const sectionHtml = renameClassesInHtml(mapColors(stripUnsafe(html), entryA), classMaps.get(block.captureId))
        if (!htmlByCapture.has(block.captureId)) htmlByCapture.set(block.captureId, [])
        htmlByCapture.get(block.captureId).push(sectionHtml)
        blocksHtml.push(sectionOpen + ' data-kind="' + escapeHtml(block.kindLabel || 'section') + '"' + styleAttr + regionAttrs + '>' + sectionHtml + '</section>')
      } else if (block.type === 'atom') {
        const snippet = atomSnippet(block)
        componentIndex += 1
        componentFiles['components/component-' + componentIndex + '.html'] =
          '<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"></head><body>' + snippet + '</body></html>'
        blocksHtml.push(sectionOpen + styleAttr + regionAttrs + '>' + snippet + '</section>')
      } else if (block.type === 'image') {
        blocksHtml.push(sectionOpen + styleAttr + regionAttrs + '><img src="' + escapeHtml(block.src || '') + '" alt="" style="max-width:100%;height:auto;display:block"></section>')
      }
    }
    const cssStats = { before: 0, after: 0 }
    const styles = [...cssByCapture.entries()]
      .map(([captureId, css]) => {
        const scoped = renameClassesInCss(scopeCss(css, 'ss-scope-' + captureId), classMaps.get(captureId))
        const trimmed = trimCss(scoped, 'ss-scope-' + captureId, htmlByCapture.get(captureId) || [])
        cssStats.before += trimmed.before
        cssStats.after += trimmed.after
        return '/* scoped: ' + captureId + ' */\n' + trimmed.css
      })
      .join('\n')
    const cssLabel = cssStats.after > 0
      ? '（CSS ' + formatBytes(cssStats.before) + ' → ' + formatBytes(cssStats.after) + '）'
      : ''
    const regionCss = draft.mode === 'regions'
      ? '<style>*{box-sizing:border-box}body{margin:0;line-height:1.6}.ss-page{position:relative;width:100%;max-width:' + (ARTBOARD_WIDTHS[draft.artboard] || 1440) + 'px;height:' + (ARTBOARD_HEIGHTS[draft.artboard] || 900) + 'px;overflow:auto;margin:0 auto;background:var(--ss-bg);container-type:inline-size}.ss-page-flow,.ss-region-grid{display:grid;grid-template-columns:repeat(' + regionConfig().cols + ',minmax(0,1fr));gap:16px;align-items:start}.ss-page-flow{padding:16px}.ss-region{position:relative;min-width:0;grid-column:span var(--ss-span-current,12);overflow:visible}.ss-region[data-newrow="1"]{grid-column:1 / span var(--ss-span-current,12)}.ss-region[data-hidden="1"]{display:none}.ss-region.ss-overlay{position:absolute;grid-column:auto}.ss-region-grid{position:relative}.ss-region img{max-width:100%;height:auto;display:block}@media(max-width:900px){.ss-page{height:' + (draft.artboard === 'mobile' ? 812 : 1024) + 'px}}@container(max-width:900px){.ss-page-flow,.ss-region-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.ss-region{--ss-span-current:var(--ss-span-tablet,6)!important}.ss-region[data-hide-tablet="1"]{display:none}}@media(max-width:600px){.ss-page{height:812px}}@container(max-width:600px){.ss-page-flow,.ss-region-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.ss-region{--ss-span-current:var(--ss-span-mobile,3)!important}.ss-region[data-hide-tablet="1"]{display:block}.ss-region[data-hide-mobile="1"],.ss-region[data-hidden="1"]{display:none}}</style>'
      : ''
    const pageContent = draft.mode === 'regions'
      ? '<main class="ss-page"><div class="ss-page-flow">' + blocksHtml.join('\n') + '</div>' + overlayBlocksHtml.join('\n') + '</main>'
      : blocksHtml.join('\n')
    const indexHtml = '<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + escapeHtml(entryA.label || 'StyleScout page') + '</title>'
      + '<link rel="stylesheet" href="theme.css">'
      + '<style>body{margin:0;background:var(--ss-bg);color:var(--ss-text);font-family:var(--ss-font-body)}.ss-block{position:relative;overflow:hidden}.ss-region{position:relative;overflow:hidden}</style>'
      + regionCss
      + '<style>' + styles + '</style></head><body>' + pageContent + '</body></html>'
    const files = Object.assign({
      'index.html': indexHtml,
      'theme.css': buildThemeCss(entryA),
      'tokens.json': JSON.stringify(buildTokens(entryA), null, 2),
    }, componentFiles)
    const writeDir = ($('export-dir').value || '').trim()
    if (mode === 'project') {
      if (writeDir === '') {
        setStatus('先在「写入目录」填目标项目目录（需在 git 仓库内）', 'error')
        return
      }
      try {
        const data = await api('/style-scout/api/export-project', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name: entryA.label || 'StyleScout page', files, targetDir: writeDir, commit: true }),
        })
        renderProjectResult(data, cssLabel)
        setStatus((data.committed ? '已提交到分支 ' + data.branch : '已写入 worktree ' + data.worktree + '（未提交）') + cssLabel, 'ok')
      } catch (error) {
        setStatus('导出到项目失败：' + error.message, 'error')
      }
      return
    }
    try {
      const data = await api('/style-scout/api/export-bundle', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(Object.assign({ name: entryA.label || 'StyleScout page', files }, writeDir ? { writeDir } : {})),
      })
      renderExportResult(data, cssLabel)
      setStatus('已导出拼装页（' + data.written.length + ' 个文件）' + cssLabel, 'ok')
    } catch (error) {
      setStatus('导出失败：' + error.message, 'error')
    }
  }

  function renderProjectResult(data, extra) {
    const host = $('canvas-export')
    if (!host) return
    host.textContent = ''
    host.classList.add('show')
    host.append(el('span', { text: '已导出到项目：' }))
    host.append(el('span', { style: { color: 'var(--text)', fontFamily: 'var(--mono)' }, text: data.branch }))
    host.append(el('span', { style: { color: 'var(--muted)', fontFamily: 'var(--mono)', fontSize: '10px' }, text: data.worktree }))
    if (extra) host.append(el('span', { style: { color: '#067647' }, text: extra }))
    if (data.stat) {
      host.append(el('div', {
        style: { width: '100%', whiteSpace: 'pre-wrap', fontFamily: 'var(--mono)', fontSize: '10px', color: 'var(--muted)', maxHeight: '90px', overflow: 'auto' },
        text: data.stat,
      }))
    }
    host.append(el('div', { style: { width: '100%', display: 'flex', gap: '12px', flexWrap: 'wrap' } }, [
      el('span', { class: 'hint', text: 'diff: ' + data.diffCommand }),
      el('span', { class: 'hint', text: 'merge: ' + data.mergeCommand }),
    ]))
    if (data.commitError) {
      host.append(el('div', { style: { color: '#b54708' }, text: '提交失败：' + data.commitError + '（文件已写入 worktree，可手动提交）' }))
    }
  }

  function renderExportResult(data, extra) {
    const host = $('canvas-export')
    if (!host) return
    host.textContent = ''
    host.classList.add('show')
    host.append(el('span', { text: '已导出：' }))
    host.append(el('a', { href: data.url, target: '_blank', rel: 'noreferrer', text: 'index.html' }))
    host.append(el('a', { href: data.url.replace(/index\.html$/, 'theme.css'), target: '_blank', rel: 'noreferrer', text: 'theme.css' }))
    if (extra) host.append(el('span', { style: { color: '#067647' }, text: extra }))
    host.append(el('span', { style: { color: 'var(--muted)', fontFamily: 'var(--mono)' }, text: data.dir }))
    if (data.writtenDir) host.append(el('span', { style: { color: '#067647' }, text: '已写入 ' + data.writtenDir }))
  }

  /* ---------- library ---------- */
  function renderLibrary() {
    const list = $('library')
    list.textContent = ''
    const filtersHost = $('lib-filters')
    if (filtersHost) {
      filtersHost.textContent = ''
      const favoriteCount = state.entries.filter((entry) => entry.favorite === true).length
      filtersHost.append(el('button', {
        type: 'button',
        class: state.favoriteOnly ? 'on' : '',
        text: '★ 收藏 ' + favoriteCount,
        onclick: () => { state.favoriteOnly = !state.favoriteOnly; renderLibrary() },
      }))
      const tags = [...new Set(state.entries.flatMap((entry) => entry.tags || []))]
      for (const tag of tags) {
        filtersHost.append(el('button', {
          type: 'button',
          class: state.tagFilter === tag ? 'on' : '',
          text: '#' + tag,
          onclick: () => { state.tagFilter = state.tagFilter === tag ? null : tag; renderLibrary() },
        }))
      }
      if (state.favoriteOnly || state.tagFilter !== null) {
        filtersHost.append(el('button', {
          type: 'button',
          text: '清除筛选',
          onclick: () => { state.favoriteOnly = false; state.tagFilter = null; renderLibrary() },
        }))
      }
    }
    const entries = state.entries
      .filter((entry) => (state.favoriteOnly ? entry.favorite === true : true))
      .filter((entry) => (state.tagFilter === null ? true : (entry.tags || []).includes(state.tagFilter)))
    $('count').textContent = entries.length === state.entries.length
      ? String(entries.length)
      : entries.length + '/' + state.entries.length
    if (entries.length === 0) {
      list.append(el('div', {
        class: 'empty',
        text: state.entries.length === 0 ? '还没有采集。输入 URL 点「采集」，或从 DSH 里采。' : '没有符合筛选的资产。',
      }))
      return
    }
    for (const entry of entries) {
      const thumb = entry.coverUrl
        ? el('img', { class: 'lib-thumb', src: entry.coverUrl, alt: '' })
        : el('span', {
            class: 'lib-thumb',
            style: { background: (entry.layers && (entry.layers[activeLayerKey(entry)] || {}).background) || '#ccc' },
          })
      const nameNode = el('span', { class: 'lib-label', text: entry.label || entry.name || entry.id })
      const subNode = el('span', { class: 'lib-sub', text: (entry.mode || '') + ' · ' + hostOf(entry.source) })
      const meta = el('div', { class: 'lib-meta', style: { cursor: 'pointer' } }, [nameNode, subNode])
      meta.addEventListener('click', () => { state.selectedId = entry.id; renderAll() })
      const actions = el('div', { class: 'lib-actions' }, [
        el('button', {
          type: 'button',
          class: entry.favorite === true ? 'on' : '',
          title: '收藏',
          text: '★',
          onclick: (event) => { event.stopPropagation(); patchEntry(entry.id, { favorite: entry.favorite !== true }) },
        }),
        el('button', {
          type: 'button',
          title: '重命名',
          text: '✎',
          onclick: (event) => { event.stopPropagation(); renameEntry(entry) },
        }),
        el('button', {
          type: 'button',
          title: '编辑标签',
          text: '#',
          onclick: (event) => { event.stopPropagation(); editTags(entry) },
        }),
      ])
      const card = el('div', { class: 'lib-card' + (entry.id === state.selectedId ? ' selected' : '') })
      card.append(el('div', { class: 'lib-row' }, [thumb, meta, actions]))
      if (Array.isArray(entry.tags) && entry.tags.length > 0) {
        card.append(el('div', { class: 'lib-tags' }, entry.tags.map((tag) => el('span', { class: 'chip', text: '#' + tag }))))
      }
      card.addEventListener('click', () => { state.selectedId = entry.id; renderAll() })
      list.append(card)
    }
  }

  /* ---------- components ---------- */
  function applyCapturedStyle(node, style, kind) {
    const map = {
      color: 'color',
      background: 'backgroundColor',
      borderRadius: 'borderRadius',
      fontFamily: 'fontFamily',
      boxShadow: 'boxShadow',
    }
    for (const [key, prop] of Object.entries(map)) {
      if (style && style[key]) node.style[prop] = style[key]
    }
    const rawBg = style && style.background
    if (!rawBg || rawBg === 'transparent' || rawBg === 'rgba(0, 0, 0, 0)') node.style.backgroundColor = 'var(--surface)'
    if (style && style.border && style.border !== 'none') node.style.border = style.border
    else node.style.border = '1px solid var(--line)'

    /* Specimen tiles, not full-size copies: clamp type and padding so a
     * captured hero button cannot blow up the component panel. */
    const rawSize = parseFloat(style && style.fontSize)
    const size = Number.isFinite(rawSize) ? rawSize : 13
    node.style.fontSize = Math.min(Math.max(size, 10), kind === 'card' ? 12 : 15) + 'px'
    node.style.fontWeight = (style && style.fontWeight) || '500'
    node.style.minHeight = '0'
    node.style.height = 'auto'
    node.style.overflow = 'hidden'
    if (kind === 'card') {
      node.style.padding = '10px 12px'
      node.style.maxWidth = '200px'
      node.style.maxHeight = '132px'
      node.style.lineHeight = '1.4'
      node.style.display = '-webkit-box'
      node.style.webkitLineClamp = '3'
      node.style.webkitBoxOrient = 'vertical'
    } else if (kind === 'input') {
      node.style.padding = '4px 8px'
      node.style.width = '150px'
      node.style.height = '26px'
    } else {
      node.style.padding = '5px 10px'
      node.style.maxWidth = '190px'
      node.style.display = 'inline-flex'
      node.style.alignItems = 'center'
      node.style.justifyContent = 'center'
      node.style.whiteSpace = 'nowrap'
      node.style.textOverflow = 'ellipsis'
    }
  }

  function countAtoms(entry) {
    const components = (entry && entry.components) || {}
    return ['buttons', 'inputs', 'cards', 'links', 'headings']
      .reduce((total, key) => total + (Array.isArray(components[key]) ? components[key].length : 0), 0)
  }

  function countAssets(entry) {
    const assets = (entry && entry.assets) || {}
    return (assets.images || []).length + (assets.icons || []).length + (assets.fonts || []).length
  }

  function assetsIndexOf(entry) {
    return entry !== null && entry !== undefined && entry.assetsIndex && Array.isArray(entry.assetsIndex.assets) ? entry.assetsIndex : null
  }

  function blockFromAsset(asset) {
    if (asset === null || asset === undefined) return null
    const source = asset.source || {}
    if (asset.kind === 'section') {
      return { id: nextBlockId(), type: 'section', captureId: asset.captureId, sectionId: source.sectionId, label: asset.label, kindLabel: source.kind || 'section', bbox: asset.bbox || null }
    }
    if (asset.group === 'component') {
      return { id: nextBlockId(), type: 'atom', captureId: asset.captureId, label: asset.label, kindLabel: source.atomType || asset.kind, atom: { text: source.text || '', style: source.style || {} } }
    }
    if (asset.kind === 'image') {
      return { id: nextBlockId(), type: 'image', captureId: asset.captureId, label: asset.label, kindLabel: 'image', src: source.src || source.thumb || '', ratio: source.w && source.h ? source.w / source.h : 1.6 }
    }
    return null
  }

  function countLayers(entry) {
    if (draft.mode === 'regions') {
      let total = 0
      const walk = (regions) => {
        for (const region of regions) {
          total += 1
          if (Array.isArray(region.children)) walk(region.children)
        }
      }
      walk(draft.regions)
      return total
    }
    if (draft.mode === 'template') return templateSlots().length
    return draft.blocks.length
  }

  function syncCompTabs(entry) {
    const index = assetsIndexOf(entry)
    const counts = {
      assets: index !== null
        ? index.counts.total
        : (entry && entry.sections ? entry.sections.length : 0) + countAtoms(entry) + countAssets(entry),
      layers: countLayers(entry),
    }
    const labels = { assets: '素材', layers: '图层' }
    document.querySelectorAll('#comp-tabs button').forEach((button) => {
      const tab = button.dataset.tab
      button.classList.toggle('on', state.compTab === tab)
      button.replaceChildren(
        el('span', { class: 'tab-label', text: labels[tab] || tab }),
        el('span', { class: 'tab-count', text: String(counts[tab] || 0) }),
      )
    })
  }

  function sanitizeSvg(markup) {
    try {
      const doc = new DOMParser().parseFromString(String(markup), 'image/svg+xml')
      const svg = doc.querySelector('svg')
      if (!svg) return null
      svg.querySelectorAll('script, foreignObject').forEach((node) => node.remove())
      for (const node of svg.querySelectorAll('*')) {
        for (const attr of Array.from(node.attributes)) {
          if (/^on/i.test(attr.name)) node.removeAttribute(attr.name)
        }
      }
      return svg.outerHTML
    } catch {
      return null
    }
  }

  function renderUnifiedAssets(entry) {
    const host = $('components')
    host.textContent = ''
    const filters = [
      ['all', '全部'],
      ['section', '区块'],
      ['atom', '组件'],
      ['image', '图片'],
    ]
    const filterRow = el('div', { class: 'asset-filters' }, filters.map(([value, label]) => el('button', {
      type: 'button',
      class: state.assetFilter === value ? 'on' : '',
      text: label,
      onclick: () => {
        state.assetFilter = value
        renderPanel(entry)
      },
    })))
    host.append(filterRow)
    const index = assetsIndexOf(entry)
    const counts = index !== null
      ? index.counts
      : {
          section: Array.isArray(entry.sections) ? entry.sections.length : 0,
          component: countAtoms(entry),
          media: countAssets(entry),
          total: (Array.isArray(entry.sections) ? entry.sections.length : 0) + countAtoms(entry) + countAssets(entry),
        }
    const filter = state.assetFilter || 'all'
    if (filter === 'all' || filter === 'section') {
      host.append(el('div', { class: 'group-title', text: '区块 · ' + counts.section + ' 个（整段参考，不直接放入画布）' }))
      renderSections(entry, host, true)
    }
    if (filter === 'all' || filter === 'atom') {
      host.append(el('div', { class: 'group-title', text: '组件 · ' + counts.component + ' 个（按钮/输入框/卡片/文字）' }))
      renderAtoms(entry, host, true)
    }
    if (filter === 'all' || filter === 'image') {
      host.append(el('div', { class: 'group-title', text: '图片 / 图标 / 字体 · ' + counts.media + ' 个' }))
      renderAssetsPane(entry, host, true)
    }
  }

  function renderSections(entry, target, append) {
    const host = target || $('components')
    if (!append) host.textContent = ''
    const sections = Array.isArray(entry.sections) ? entry.sections : []
    if (sections.length === 0) {
      host.append(el('div', { class: 'empty', text: '这份采集没有区块数据（旧版采集）。重新采集一次即可出现导航/hero/卡片区/页脚。' }))
      return
    }
    if (!append) host.append(el('div', { class: 'group-title', text: '区块 ' + sections.length + ' 个 · 整段参考（不直接放入画布，请拖左侧单个组件/图片）' }))
    const list = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } })
    for (const section of sections) {
      const card = el('div', { style: { border: '1px solid var(--line)', borderRadius: '10px', overflow: 'hidden', background: 'var(--panel)' } })
      if (section.shotUrl) {
        card.append(el('img', { src: section.shotUrl, alt: '', style: { width: '100%', height: '92px', objectFit: 'cover', objectPosition: 'top', display: 'block', background: 'var(--surface)' } }))
      } else {
        card.append(el('div', { style: { height: '40px', background: 'var(--surface)' } }))
      }
      const body = el('div', { style: { padding: '7px 9px' } })
      body.append(el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, [
        el('span', { class: 'chip', text: section.kind || 'section' }),
        el('span', { style: { fontSize: '10px', color: 'var(--muted)' }, text: section.bbox ? section.bbox.w + '×' + section.bbox.h : '' }),

  function renderAssetsPane(entry, target, append) {
    const host = target || $('components')
    if (!append) host.textContent = ''

    const icons = assets.icons || []
    const fonts = assets.fonts || []

      host.append(el('div', { class: 'empty', text: '这份采集没有素材数据（旧版采集）。重新采集一次即可出现图片/图标/字体引用。' }))

        attachPanelDrag(tile, { type: 'image', captureId: entry.id, kind: 'image', label: (entry.label || entry.id) + ' · 图片', src: image.thumbUrl || image.src, ratio: image.w && image.h ? image.w / image.h : 1.6 })
        if (image.thumbUrl) tile.append(el('img', { src: image.thumbUrl, alt: image.alt || '', style: { width: '100%', height: '64px', objectFit: 'cover', display: 'block', background: 'var(--surface)' } }))
        else tile.append(el('div', { style: { height: '40px', background: 'var(--surface)' } }))
        tile.append(el('div', { style: { display: 'flex', alignItems: 'center', gap: '4px', padding: '4px 6px' } }, [
          el('div', { style: { flex: '1 1 auto', minWidth: 0, fontSize: '9px', color: 'var(--muted)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }, text: image.alt || image.src || '' }),
          el('button', { type: 'button', class: 'mini', text: '＋', onclick: () => addImageBlock(entry, image) }),
        ]))
        grid.append(tile)

    }
    if (icons.length > 0) {
      host.append(el('div', { class: 'group-title', text: '图标 · ' + icons.length }))
      const row = el('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } })
      for (const icon of icons) {
        const svg = sanitizeSvg(icon.svg)
        const tile = el('div', { title: icon.name || 'icon', style: { width: '34px', height: '34px', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid var(--line)', borderRadius: '8px', background: 'var(--panel)', color: 'var(--text)' } })
        if (svg) tile.innerHTML = svg
        if (tile.firstElementChild) {
          tile.firstElementChild.setAttribute('width', '16')
          tile.firstElementChild.setAttribute('height', '16')

        row.append(tile)
      }
      host.append(row)

    if (fonts.length > 0) {
      host.append(el('div', { class: 'group-title', text: '字体引用 · ' + fonts.length + '（不打包字体文件）' }))

      for (const font of fonts) chips.append(el('span', { class: 'chip', text: font.family }))
      host.append(chips)

  function renderPanel(entry) {
    const host = $('components')
    host.textContent = ''
    if (entry) {
      if (state.compTab === 'layers') renderLayers(entry)
      else renderUnifiedAssets(entry)
    }
    syncCompTabs(entry)
  }

  function renderAtoms(entry, target, append) {
    const host = target || $('components')
    if (!append) host.textContent = ''
    if (!entry) return
    const groups = [
      ['按钮', entry.components && entry.components.buttons],
      ['输入框', entry.components && entry.components.inputs],
      ['卡片', entry.components && entry.components.cards],
      ['链接', entry.components && entry.components.links],
      ['标题层级', entry.components && entry.components.headings],
    ].filter((group) => Array.isArray(group[1]) && group[1].length > 0)

    if (groups.length === 0) {
      host.append(el('div', { class: 'empty', text: '这份采集没有组件样本（或组件采集是旧版）。重新采集一次即可。' }))
      return
    }

    for (const [label, items] of groups) {
      const row = el('div', { class: 'group-row' })
      for (const item of items) {
        const style = item.style || {}
        if (label === '标题层级') {
          const wrap = el('span', { class: 'specimen-wrap' }, [
            el('span', { class: 'chip', text: String(item.tag || item.kind || '').toUpperCase() + ' ' + (style.fontSize || '') + ' / ' + (style.fontWeight || '') + ' ×' + (item.count || 0) }),
            miniBtn('＋', () => addAtomBlock(entry, label, item)),
          ])
          attachPanelDrag(wrap, { type: 'atom', captureId: entry.id, kind: label, label: (entry.label || entry.id) + ' · ' + label, atom: { text: item.text || '', style } })
          row.append(wrap)
          continue
        }
        let node
        if (label === '按钮' || label === '链接') {
          node = el('button', { text: item.text || (label === '链接' ? 'Link' : 'Button') })
          applyCapturedStyle(node, style, 'button')
        } else if (label === '输入框') {
          node = el('input', { class: 'text', placeholder: item.text || 'Input', readonly: 'readonly' })
          applyCapturedStyle(node, style, 'input')
        } else {
          node = el('div', { class: 'sample-card' }, [
            el('div', { text: item.text || 'Card', style: { fontWeight: '600' } }),
            el('div', { text: '×' + (item.count || 0), style: { fontSize: '10px', color: 'var(--muted)', marginTop: '4px' } }),
          ])
          applyCapturedStyle(node, style, 'card')
        }
        const wrap = el('span', { class: 'specimen-wrap' }, [node, miniBtn('＋', () => addAtomBlock(entry, label, item))])
        attachPanelDrag(wrap, { type: 'atom', captureId: entry.id, kind: label, label: (entry.label || entry.id) + ' · ' + label, atom: { text: item.text || '', style } })
        row.append(wrap)
      }
      host.append(el('div', null, [el('div', { class: 'group-title', text: label + ' · ' + items.length + ' 种' }), row]))
    }
  }

  /* ---------- layer tree (结构图层) ---------- */
  function findRegionContext(regions, id, parent = null) {
    for (const region of regions) {
      if (region.id === id) return { region, list: regions, parent }
      if (Array.isArray(region.children)) {
        const found = findRegionContext(region.children, id, region)
        if (found !== null) return found
      }
    }
    return null
  }

  function regionContains(container, node) {
    if (!Array.isArray(container.children)) return false
    for (const child of container.children) {
      if (child === node || regionContains(child, node)) return true
    }
    return false
  }

  function layerRow(options) {
    const row = el('div', {
      class: 'layer-row' + (options.selected ? ' selected' : '') + (options.overlay ? ' overlay' : ''),
      'data-layer-id': options.id,
    })
    row.style.paddingLeft = (8 + options.depth * 14) + 'px'
    row.append(el('span', { class: 'layer-grip', text: options.hasChildren ? '▾' : '·' }))
    row.append(el('span', { class: 'layer-type', text: options.typeLabel }))
    row.append(el('span', { class: 'layer-name', text: options.name || '' }))
    if (typeof options.onToggleHidden === 'function') {
      const eye = el('button', { type: 'button', class: 'layer-eye' + (options.hidden ? ' on' : ''), title: options.hidden ? '显示该层' : '隐藏该层', text: options.hidden ? '○' : '●' })
      eye.addEventListener('click', (event) => {
        event.stopPropagation()
        options.onToggleHidden()
      })
      row.append(eye)
    }
    row.addEventListener('click', () => selectLayer(options.id))
    if (options.region !== undefined && options.region !== null) {
      row.setAttribute('draggable', 'true')
      row.addEventListener('dragstart', (event) => {
        layerDrag = findRegionContext(draft.regions, options.region.id)
        try {
          event.dataTransfer.setData('text/plain', options.region.id)
          event.dataTransfer.effectAllowed = 'move'
        } catch {}
        event.stopPropagation()
      })
      row.addEventListener('dragend', () => {
        layerDrag = null
        document.querySelectorAll('.drop-ok').forEach((node) => node.classList.remove('drop-ok'))
      })
      row.addEventListener('dragover', (event) => {
        if (layerDrag === null) return
        if (layerDrag.region === options.region) return
        if (regionContains(layerDrag.region, options.region)) return
        event.preventDefault()
        row.classList.add('drop-ok')
      })
      row.addEventListener('dragleave', () => row.classList.remove('drop-ok'))
      row.addEventListener('drop', (event) => {
        if (layerDrag === null) return
        event.preventDefault()
        event.stopPropagation()
        row.classList.remove('drop-ok')
        const targetCtx = findRegionContext(draft.regions, options.region.id)
        if (targetCtx === null || targetCtx.region === layerDrag.region) return
        if (regionContains(layerDrag.region, targetCtx.region)) return
        const source = layerDrag
        layerDrag = null
        const sourceIndex = source.list.indexOf(source.region)
        if (sourceIndex >= 0) source.list.splice(sourceIndex, 1)
        const preset = REGION_TYPES[targetCtx.region.type] || REGION_TYPES.free
        const isContainer = preset.container === true || Array.isArray(targetCtx.region.children)
        if (isContainer) {
          if (!Array.isArray(targetCtx.region.children)) targetCtx.region.children = []
          targetCtx.region.children.push(source.region)
        } else {
          const targetIndex = targetCtx.list.indexOf(targetCtx.region)
          targetCtx.list.splice(targetIndex + 1, 0, source.region)
        }
        saveDraft()
      })
    }
    return row
  }

  function applyLayerSelection() {
    document.querySelectorAll('[data-layer-id]').forEach((node) => {
      if (node.classList.contains('layer-row')) return
      node.classList.toggle('selected', node.getAttribute('data-layer-id') === state.selectedLayer)
    })
  }

  function scrollSelectedIntoView() {
    requestAnimationFrame(() => {
      const node = state.selectedLayer === null ? null : document.querySelector('#canvas-a [data-layer-id="' + state.selectedLayer + '"]')
      if (node !== null && typeof node.scrollIntoView === 'function') node.scrollIntoView({ block: 'center', behavior: 'smooth' })
    })
  }

  function selectLayer(id) {
    state.selectedLayer = id
    renderPanel(selectedEntry())
    applyLayerSelection()
    scrollSelectedIntoView()
  }

  function renderLayers(entry) {
    const host = $('components')
    host.textContent = ''
    if (draft.mode === 'regions') {
      if (draft.regions.length === 0) {
        host.append(el('div', { class: 'empty', text: '还没有区域：先在「区域画布」拖素材或新建区域。' }))
        return
      }
      const build = (regions, depth) => {
        for (const region of regions) {
          const preset = REGION_TYPES[region.type] || REGION_TYPES.free
          const isContainer = preset.container === true || Array.isArray(region.children)
          const fillLabel = region.fill
            ? (region.fill.kindLabel || '已填')
            : (isContainer ? (region.children || []).length + ' 子区域' : '空')
          host.append(layerRow({
            id: 'region:' + region.id,
            region,
            depth,
            typeLabel: preset.label,
            name: fillLabel,
            hasChildren: isContainer,
            overlay: region.layer === 'overlay',
            hidden: region.hidden === true,
            selected: state.selectedLayer === 'region:' + region.id,
            onToggleHidden: () => {
              region.hidden = region.hidden !== true
              saveDraft()
            },
          }))
          if (Array.isArray(region.children)) build(region.children, depth + 1)
        }
      }
      build(draft.regions, 0)
      const rootZone = el('div', { class: 'layer-drop-root', text: '拖到这里移到顶层' })
      rootZone.addEventListener('dragover', (event) => {
        if (layerDrag === null) return
        event.preventDefault()
        rootZone.classList.add('drop-ok')
      })
      rootZone.addEventListener('dragleave', () => rootZone.classList.remove('drop-ok'))
      rootZone.addEventListener('drop', (event) => {
        if (layerDrag === null) return
        event.preventDefault()
        rootZone.classList.remove('drop-ok')
        const source = layerDrag
        layerDrag = null
        const index = source.list.indexOf(source.region)
        if (index >= 0) source.list.splice(index, 1)
        draft.regions.push(source.region)
        saveDraft()
      })
      host.append(rootZone)
      return
    }
    if (draft.mode === 'template') {
      for (const slot of templateSlots()) {
        const filled = draft.slots[slot.id]
        host.append(layerRow({
          id: 'slot:' + slot.id,
          depth: 0,
          typeLabel: '空位',
          name: slot.label + (filled ? ' · 已填' : ' · 空'),
          selected: state.selectedLayer === 'slot:' + slot.id,
        }))
      }
      return
    }
    if (draft.blocks.length === 0) {
      host.append(el('div', { class: 'empty', text: '画布还没有块：从「区块 / 组件」里加。' }))
      return
    }
    for (const block of draft.blocks) {
      host.append(layerRow({
        id: 'block:' + block.id,
        depth: 0,
        typeLabel: block.kindLabel || block.type,
        name: block.label || '',
        selected: state.selectedLayer === 'block:' + block.id,
      }))
    }
  }

  /* ---------- inspector ---------- */
  function renderInspector(entry) {
    const host = $('inspector')
    host.textContent = ''
    if (!entry) {
      host.append(el('div', { class: 'empty', text: '未选择资产' }))
      return
    }
    const key = activeLayerKey(entry)
    const layer = (entry.layers && entry.layers[key]) || {}
    const keys = layerKeys(entry)

    host.append(el('div', { class: 'kv' }, [el('span', { text: '来源' }), el('span', { text: hostOf(entry.source) })]))
    host.append(el('div', { class: 'kv' }, [el('span', { text: '模式' }), el('span', { text: entry.mode || '—' })]))
    host.append(el('div', { class: 'kv' }, [el('span', { text: '大小' }), el('span', { text: entry.bytes ? (entry.bytes / 1024 / 1024).toFixed(1) + ' MB' : '—' })]))
    if (entry.localAssets !== null && entry.localAssets !== undefined) {
      const assets = entry.localAssets
      const size = assets.bytes > 0 ? ' · ' + (assets.bytes / 1024 / 1024).toFixed(1) + ' MB' : ''
      host.append(el('div', { class: 'kv' }, [el('span', { text: '本地素材' }), el('span', { text: assets.count + ' 个' + size + (assets.fonts > 0 ? '（字体 ' + assets.fonts + '）' : '') })]))
    }
    host.append(el('div', { class: 'kv' }, [el('span', { text: 'ID' }), el('span', { text: entry.id })]))
    if (entry.coverUrl) {
      host.append(el('a', { href: entry.coverUrl, target: '_blank', rel: 'noreferrer' }, [el('img', { src: entry.coverUrl, alt: '原站截图', style: { width: '100%', maxHeight: '170px', objectFit: 'cover', objectPosition: 'top', borderRadius: '8px', border: '1px solid var(--line)' } })]))
    }

    if (keys.length > 1) {
      const tabs = el('div', { class: 'tabs' })
      for (const k of keys) {
        tabs.append(el('button', {
          class: k === key ? 'on' : '',
          text: k === 'dark' ? '深色层' : k === 'light' ? '浅色层' : k,
          onclick: () => { state.layer = k; renderAll() },
        }))
      }
      host.append(tabs)
    }

    const swatches = el('div', { class: 'swatches' })
    const roles = [
      ['背景', layer.background],
      ['表面', layer.surface],
      ['正文', layer.text],
      ['次要', layer.muted],
      ['边框', layer.border],
      ['强调', entry.accent && entry.accent.hex],
    ]
    for (const [role, hex] of roles) {
      const filter = !hex
        ? el('div', { class: 'swatch' }, [el('div', { class: 'fill', style: { background: 'var(--surface)' } }), el('div', { class: 'cap' }, [el('b', { text: '未确定' }), role])])
        : el('div', { class: 'swatch' }, [
            el('div', { class: 'fill', style: { background: hex } }),
            el('div', { class: 'cap' }, [el('b', { text: hex }), role]),
          ])
      swatches.append(filter)
    }
    host.append(swatches)

    const families = entry.families || {}
    const familyText = Object.entries(families).map(([role, value]) => (value && value.family ? role + ': ' + value.family : '')).filter(Boolean)
    if (familyText.length > 0) {
      host.append(el('div', null, [el('div', { class: 'group-title', text: '字体' }), el('div', { class: 'chips' }, familyText.map((text) => el('span', { class: 'chip', text })))]))
    }
    if (Array.isArray(entry.typeScale) && entry.typeScale.length > 0) {
      host.append(el('div', null, [el('div', { class: 'group-title', text: '字阶' }), el('div', { class: 'chips' }, entry.typeScale.map((size) => el('span', { class: 'chip', text: String(size) })))]))
    }
    if (entry.spacing && Array.isArray(entry.spacing.scale)) {
      host.append(el('div', null, [el('div', { class: 'group-title', text: '间距（base ' + (entry.spacing.baseUnit || 4) + 'px）' }), el('div', { class: 'chips' }, entry.spacing.scale.map((size) => el('span', { class: 'chip', text: String(size) })))]))
    }
    if (entry.radius && Array.isArray(entry.radius.scale)) {
      host.append(el('div', null, [el('div', { class: 'group-title', text: '圆角' }), el('div', { class: 'chips' }, entry.radius.scale.map((size) => el('span', { class: 'chip', text: String(size) })))]))
    }
    if (Array.isArray(entry.warnings) && entry.warnings.length > 0) {
      host.append(el('div', null, [el('div', { class: 'group-title', text: '告警' }), el('div', { class: 'warn', text: entry.warnings.join(' / ') })]))
    }
    if (!state.demo) {
      host.append(el('button', {
        class: 'danger',
        text: '删除这份采集',
        onclick: () => deleteEntry(entry),
      }, []))
    }
  }

  /* ---------- actions ---------- */
  async function deleteEntry(entry) {
    if (!window.confirm('删除「' + (entry.label || entry.id) + '」及其 capture/DNA 文件？')) return
    try {
      await api('/style-scout/api/captures/' + encodeURIComponent(entry.id), { method: 'DELETE' })
      setStatus('已删除 ' + entry.id, 'ok')
      state.selectedId = null
      await loadLibrary()
    } catch (error) {
      setStatus('删除失败：' + error.message, 'error')
    }
  }

  async function capture() {
    const input = $('url')
    const url = input.value.trim()
    if (!/^https?:\/\//i.test(url)) { setStatus('请输入 http(s) URL', 'error'); return }
    const button = $('capture')
    button.disabled = true
    setStatus('采集中…（真浏览器，约 5–15 秒）')
    try {
      const data = await api('/style-scout/api/capture', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url }),
      })
      input.value = ''
      state.selectedId = data.entry && data.entry.id ? data.entry.id : null
      setStatus('采集完成：' + (data.entry ? data.entry.id : ''), 'ok')
      await loadLibrary()
    } catch (error) {
      setStatus('采集失败：' + error.message, 'error')
    } finally {
      button.disabled = false
    }
  }

  async function exportTheme() {
    const entry = selectedEntry()
    if (!entry) { setStatus('先选一份采集', 'error'); return }
    const css = buildThemeCss(entry, activeLayerKey(entry))
    const tokens = buildTokens(entry, activeLayerKey(entry))
    setStatus('导出中…')
    try {
      const data = await api('/style-scout/api/export', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: entry.label || 'StyleScout theme', css, tokens }),
      })
      renderExport(data)
      setStatus('已导出', 'ok')
    } catch (error) {
      setStatus('导出失败：' + error.message, 'error')
    }
  }

  function renderExport(data) {
    const host = $('export-out')
    host.textContent = ''
    host.append(el('a', { href: data.cssUrl, download: 'theme.css', text: '下载 theme.css' }))
    host.append(el('a', { href: data.tokensUrl, download: 'tokens.json', text: '下载 tokens.json' }))
    host.append(el('div', { text: data.dir }))
  }

  /* ---------- render ---------- */
  function renderAll() {
    const entry = selectedEntry()
    if (entry) {
      if (!draft.skinA) draft.skinA = entry.id
      if (!draft.skinB) {
        const other = state.entries.find((item) => item.id !== draft.skinA)
        draft.skinB = (other && other.id) || entry.id
      }
    }
    renderLibrary()
    renderPanel(entry)
    renderInspector(entry)
    renderCanvas()
  }

      buttons: [{ kind: 'button', count: 6, text: 'Get started', style: { background: '#F7F8F8', color: '#08090A', borderRadius: '10px', padding: '8px 16px', fontSize: '14px', fontWeight: '500' } }],
      inputs: [], cards: [], links: [],
      headings: [{ kind: 'h1', tag: 'h1', count: 1, text: 'Overview', style: { fontSize: '48px', fontWeight: '600', color: '#F7F8F8' } }],
    },
    sections: [
      { id: 'sec_1', kind: 'nav', text: 'Linear Product Method Customers Changelog Log in Sign up', bbox: { w: 1440, h: 64 }, childCount: 3, shotUrl: null },
      { id: 'sec_2', kind: 'hero', text: 'Plan and build products. Linear is a purpose-built tool for planning and building products.', bbox: { w: 1440, h: 720 }, childCount: 4, shotUrl: null },
      { id: 'sec_3', kind: 'features', text: 'Built for the way you work. Issues Projects Cycles Roadmaps.', bbox: { w: 1440, h: 880 }, childCount: 6, shotUrl: null },
    ],
    assets: {
      images: [{ src: 'https://linear.app/assets/hero.png', alt: 'hero product shot', w: 1200, h: 720, thumbUrl: null }],
      icons: [],
      fonts: [{ family: 'Inter Variable' }, { family: 'Berkeley Mono' }],
    },
    coverUrl: null,
    bytes: null,
    warnings: [],
  }

  /* ---------- resizable / detachable layout ---------- */
  const LAYOUT_DEFAULT = { lib: 248, comp: 260, insp: 300 }
  const layout = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem('ss.layout.v2') || '{}')
      return {
        lib: Number(saved.lib) || LAYOUT_DEFAULT.lib,
        comp: Number(saved.comp) || LAYOUT_DEFAULT.comp,
        insp: Number(saved.insp) || LAYOUT_DEFAULT.insp,
        hidden: Object.assign({}, saved.hidden || {}),
      }
    } catch {
      return { lib: LAYOUT_DEFAULT.lib, comp: LAYOUT_DEFAULT.comp, insp: LAYOUT_DEFAULT.insp, hidden: {} }
    }
  })()

  function saveLayout() {
    try { localStorage.setItem('ss.layout.v2', JSON.stringify(layout)) } catch {}
  }

  function applyLayout() {
    const hidden = layout.hidden
    const columns = [
      hidden.library ? '0px' : layout.lib + 'px',
      hidden.library ? '0px' : '6px',
      hidden.components ? '0px' : layout.comp + 'px',
      hidden.components ? '0px' : '6px',
      'minmax(320px, 1fr)',
      hidden.inspector ? '0px' : '6px',
      hidden.inspector ? '0px' : layout.insp + 'px',
    ]
    const board = $('layout')
    if (board) board.style.gridTemplateColumns = columns.join(' ')
    const panels = { library: 'panel-library', components: 'panel-components', inspector: 'panel-inspector' }
    for (const [key, id] of Object.entries(panels)) {
      const node = $(id)
      if (node) node.classList.toggle('hidden', hidden[key] === true)
    }
    document.querySelectorAll('.splitter').forEach((splitter) => {
      const edge = splitter.dataset.edge
      const hide = edge === 'lib' ? hidden.library : edge === 'comp' ? hidden.components : hidden.inspector
      splitter.classList.toggle('hidden', hide === true)
    })
    document.querySelectorAll('[data-toggle]').forEach((button) => {
      button.classList.toggle('on', layout.hidden[button.dataset.toggle] !== true)
    })
    const focusButton = $('focus-canvas')
    if (focusButton) focusButton.classList.toggle('on', hidden.library === true && hidden.components === true && hidden.inspector === true)
  }

  function bindLayout() {
    const zoomIn = $('zoom-in')
    const zoomOut = $('zoom-out')
    const zoomLabel = $('zoom-label')
    const wheelToggle = $('zoom-wheel')
    const wheelScroll = $('canvas-scroll')
    if (zoomIn) zoomIn.addEventListener('click', () => setCanvasZoom(state.canvasZoom + 0.1))
    if (zoomOut) zoomOut.addEventListener('click', () => setCanvasZoom(state.canvasZoom - 0.1))
    if (zoomLabel) zoomLabel.addEventListener('click', () => setCanvasZoom(1))
    const zoomFit = $('zoom-fit')
    if (zoomFit) zoomFit.addEventListener('click', () => setCanvasZoom(fitZoom()))
    if (wheelToggle) {
      wheelToggle.addEventListener('click', () => {
        state.wheelZoom = state.wheelZoom !== true
        try { localStorage.setItem('ss.wheelZoom', state.wheelZoom ? '1' : '0') } catch {}
        applyCanvasZoom()
      })
    }
    if (wheelScroll) {
      wheelScroll.addEventListener('wheel', (event) => {
        const zoomIntent = state.wheelZoom === true || event.ctrlKey || event.metaKey
        if (!zoomIntent || event.shiftKey) return
        event.preventDefault()
        const rect = wheelScroll.getBoundingClientRect()
        const px = event.clientX - rect.left + wheelScroll.scrollLeft
        const py = event.clientY - rect.top + wheelScroll.scrollTop
        const ratio = Math.max(0.25, Math.min(3, state.canvasZoom * Math.exp(-event.deltaY * 0.0015))) / state.canvasZoom
        setCanvasZoom(state.canvasZoom * ratio)
        requestAnimationFrame(() => {
          wheelScroll.scrollLeft = px * ratio - (event.clientX - rect.left)
          wheelScroll.scrollTop = py * ratio - (event.clientY - rect.top)
        })
      }, { passive: false })
    }
    document.querySelectorAll('[data-collapse]').forEach((button) => {
      button.addEventListener('click', () => {
        const key = button.dataset.collapse
        layout.hidden[key] = true
        saveLayout()
        applyLayout()
      })
    })
    const focusCanvas = $('focus-canvas')
    if (focusCanvas) {
      focusCanvas.addEventListener('click', () => {
        const allHidden = layout.hidden.library === true && layout.hidden.components === true && layout.hidden.inspector === true
        for (const key of ['library', 'components', 'inspector']) layout.hidden[key] = allHidden ? false : true
        saveLayout()
        applyLayout()
      })
    }
    document.querySelectorAll('#comp-tabs button').forEach((button) => {
      button.addEventListener('click', () => {
        state.compTab = button.dataset.tab
        try { localStorage.setItem('ss.compTab', state.compTab) } catch {}
        renderPanel(selectedEntry())
      })
    })
    const skinA = $('skin-a')
    const skinB = $('skin-b')
    const splitToggle = $('split-toggle')
    if (skinA) skinA.addEventListener('change', () => { draft.skinA = skinA.value; saveDraft() })
    if (skinB) skinB.addEventListener('change', () => { draft.skinB = skinB.value; saveDraft() })
    if (splitToggle) splitToggle.addEventListener('change', () => { draft.split = splitToggle.checked; saveDraft() })
    window.addEventListener('resize', () => fitBlocks())
    const clearButton = $('canvas-clear')
    if (clearButton) clearButton.addEventListener('click', () => {
      if (draft.mode === 'regions') {
        if (draft.regions.length === 0) return
        if (!window.confirm('清空画布上的 ' + draft.regions.length + ' 个区域？')) return
        draft.regions = []
        state.picker = null
        saveDraft()
        return
      }
      if (draft.mode === 'template') {
        if (Object.keys(draft.slots).length === 0) return
        if (!window.confirm('清空所有已填的空位？')) return
        draft.slots = {}
        state.picker = null
        saveDraft()
        return
      }
      if (draft.blocks.length === 0) return
      if (!window.confirm('清空画布上的 ' + draft.blocks.length + ' 个块？')) return
      draft.blocks = []
      saveDraft()
    })
    document.querySelectorAll('#canvas-mode button').forEach((button) => {
      button.addEventListener('click', () => {
        const mode = button.dataset.mode
        draft.mode = ['template', 'regions', 'free'].includes(mode) ? mode : 'template'
        state.picker = null
        saveDraft()
      })
    })
    const templateSelect = $('template-select')
    if (templateSelect) templateSelect.addEventListener('change', () => {
      draft.templateId = templateSelect.value
      resetSlotListForTemplate()
      state.picker = null
      saveDraft()
    })
    const autofillButton = $('autofill')
    if (autofillButton) autofillButton.addEventListener('click', () => autoFillTemplate())
    const saveTemplateButton = $('save-template')
    if (saveTemplateButton) saveTemplateButton.addEventListener('click', () => saveAsTemplate())
    const deleteTemplateButton = $('delete-template')
    if (deleteTemplateButton) deleteTemplateButton.addEventListener('click', () => deleteCurrentTemplate())
    const exportTemplateButton = $('export-template')
    if (exportTemplateButton) exportTemplateButton.addEventListener('click', () => exportTemplate())
    const importTemplateButton = $('import-template')
    if (importTemplateButton) importTemplateButton.addEventListener('click', () => {
      state.templateImport = true
      renderCanvas()
      loadHostTemplates().then(() => renderCanvas())
    })
    const templateFileInput = $('template-file')
    if (templateFileInput) templateFileInput.addEventListener('change', () => {
      importTemplateFile(templateFileInput.files && templateFileInput.files[0])
      templateFileInput.value = ''
    })
    const artboardSelect = $('artboard')
    if (artboardSelect) artboardSelect.addEventListener('change', () => {
      draft.artboard = artboardSelect.value
      saveDraft()
    })
    const addRegionButton = $('add-region')
    if (addRegionButton) addRegionButton.addEventListener('click', () => {
      const select = $('region-type')
      addRegion(select ? select.value : 'free')
    })
    const exportLayoutButton = $('export-layout')
    if (exportLayoutButton) exportLayoutButton.addEventListener('click', () => exportLayout())
    const aiLayoutButton = $('ai-layout')
    if (aiLayoutButton) aiLayoutButton.addEventListener('click', () => {
      state.layoutImport = true
      state.aiPrompt = false
      renderCanvas()
      loadHostLayouts().then(() => renderCanvas())
    })
    const aiGenerateButton = $('ai-generate')
    if (aiGenerateButton) aiGenerateButton.addEventListener('click', () => {
      state.aiPrompt = state.aiPrompt !== true
      state.layoutImport = false
      renderCanvas()
    })
    const layoutFileInput = $('layout-file')
    if (layoutFileInput) layoutFileInput.addEventListener('change', () => {
      importLayoutFile(layoutFileInput.files && layoutFileInput.files[0])
      layoutFileInput.value = ''
    })
    const exportButton = $('export-page')
    if (exportButton) exportButton.addEventListener('click', () => { exportPage() })
    const exportProjectButton = $('export-project')
    if (exportProjectButton) exportProjectButton.addEventListener('click', () => { exportPage('project') })
    for (const columnId of ['canvas-a', 'canvas-b']) {
      const column = $(columnId)
      if (!column) continue
      column.addEventListener('dragover', (event) => {
        if (panelDrag === null || draft.mode !== 'free') return
        event.preventDefault()
        column.classList.add('drop-active')
      })
      column.addEventListener('dragleave', () => column.classList.remove('drop-active'))
      column.addEventListener('drop', (event) => {
        if (panelDrag === null || draft.mode !== 'free') return
        event.preventDefault()
        column.classList.remove('drop-active')
        appendBlockFromItem(panelDrag)
        panelDrag = null
        document.body.classList.remove('dragging-item')
      })
    }
    document.querySelectorAll('[data-toggle]').forEach((button) => {
      button.addEventListener('click', () => {
        const key = button.dataset.toggle
        layout.hidden[key] = layout.hidden[key] !== true
        applyLayout()
        saveLayout()
      })
    })
    document.querySelectorAll('.splitter').forEach((splitter) => {
      const edge = splitter.dataset.edge
      splitter.addEventListener('pointerdown', (event) => {
        event.preventDefault()
        const startX = event.clientX
        const start = edge === 'lib' ? layout.lib : edge === 'comp' ? layout.comp : layout.insp
        splitter.classList.add('dragging')
        try { splitter.setPointerCapture(event.pointerId) } catch {}
        const onMove = (moveEvent) => {
          const dx = moveEvent.clientX - startX
          if (edge === 'lib') layout.lib = Math.max(170, Math.min(520, start + dx))
          else if (edge === 'comp') layout.comp = Math.max(180, Math.min(520, start + dx))
          else layout.insp = Math.max(220, Math.min(560, start - dx))
          applyLayout()
        }
        const onUp = () => {
          splitter.classList.remove('dragging')
          splitter.removeEventListener('pointermove', onMove)
          splitter.removeEventListener('pointerup', onUp)
          splitter.removeEventListener('pointercancel', onUp)
          saveLayout()
        }
        splitter.addEventListener('pointermove', onMove)
        splitter.addEventListener('pointerup', onUp)
        splitter.addEventListener('pointercancel', onUp)
      })
      splitter.addEventListener('dblclick', () => {
        if (edge === 'lib') layout.lib = LAYOUT_DEFAULT.lib
        else if (edge === 'comp') layout.comp = LAYOUT_DEFAULT.comp
        else layout.insp = LAYOUT_DEFAULT.insp
        applyLayout()
        saveLayout()
      })
    })
    document.querySelectorAll('[data-pop]').forEach((button) => {
      button.addEventListener('click', () => {
        window.open('/style-scout/?focus=' + encodeURIComponent(button.dataset.pop), '_blank', 'width=1280,height=900')
      })
    })
  }

  function applyFocusMode() {
    const focus = new URLSearchParams(location.search).get('focus')
    if (!focus) return false
    const map = { library: 'panel-library', components: 'panel-components', canvas: 'panel-canvas', inspector: 'panel-inspector' }
    const node = $(map[focus])
    if (!node) return false
    document.body.classList.add('focus-mode')
    node.classList.add('focus-target')
    document.title = '采风 StyleScout · ' + focus
    return true
  }

  /* ---------- template mode retired (V4.4): migrate old drafts to region canvas ---------- */
  function regionTypeForSlot(slot) {
    const kinds = Array.isArray(slot.kinds) ? slot.kinds : []
    for (const kind of kinds) {
      if (REGION_TYPES[kind] !== undefined && REGION_TYPES[kind].container !== true) return kind
    }
    return 'free'
  }

  function migrateLegacyDraft() {
    if (draft.mode === 'template') {
      const slots = templateSlots()
      const regions = []
      slots.forEach((slot, index) => {
        const type = regionTypeForSlot(slot)
        const preset = REGION_TYPES[type] || REGION_TYPES.free
        const block = draft.slots[slot.id]
        regions.push({
          id: 'reg_' + nextBlockId(),
          type,
          width: 12,
          height: preset.height,
          newRow: index > 0,
          fill: block ? JSON.parse(JSON.stringify(block)) : null,
          breakpoints: {},
          children: undefined,
        })
      })
      draft.regions = regions
      draft.mode = 'regions'
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)) } catch {}
      return 'template'
    }
    if (draft.mode === 'free') {
      const regions = (draft.blocks || []).map((block, index) => {
        const type = block.type === 'section' && REGION_TYPES[block.kindLabel] !== undefined ? block.kindLabel : 'free'
        const preset = REGION_TYPES[type] || REGION_TYPES.free
        return {
          id: 'reg_' + nextBlockId(),
          type,
          width: 12,
          height: preset.height,
          newRow: index > 0,
          fill: JSON.parse(JSON.stringify(block)),
          breakpoints: {},
          children: undefined,
        }
      })
      draft.regions = regions
      draft.mode = 'regions'
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)) } catch {}
      return 'free'
    }
    return null
  }

  /* ---------- boot ---------- */
  async function boot() {
    document.querySelector('main').inert = true
    document.querySelector('header').inert = true
    applyFocusMode()
    loadCustomTemplates()
    try { await restoreDraft() }
    catch (error) { draftStatus('无法读取本机草稿；重启 DSH 后点重试', true) }
    const migrated = migrateLegacyDraft()
    bindLayout()
    applyLayout()
    $('capture').addEventListener('click', capture)
    $('refresh').addEventListener('click', loadLibrary)
    $('backup').addEventListener('click', backupData)
    $('export').addEventListener('click', exportTheme)
    $('save-theme').addEventListener('click', () => { saveCurrentTheme() })
    $('url').addEventListener('keydown', (event) => { if (event.key === 'Enter') capture() })
    $('retry-draft').addEventListener('click', async () => {
      try {
        if (!draftReady) await restoreDraft()
        if (draftConflict) { showDraftConflict(); return }
        await flushDraft()
        renderCanvas()
      } catch (error) { draftStatus('草稿未保存：' + error.message, true) }
    })
    window.addEventListener('beforeunload', (event) => {
      if (draftDirty || draftSaving) { event.preventDefault(); event.returnValue = '' }
    })
    await loadLibrary()
    await loadThemes()
    if (draftConflict) showDraftConflict()
    else if (migrated) saveDraft()
    else if (draftReady && draftDirty) flushDraft().catch(() => {})
    document.querySelector('main').inert = false
    document.querySelector('header').inert = false
  }
  boot()
})()
</script>
