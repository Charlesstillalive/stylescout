<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>采风 StyleScout · 工作台</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --surface: #f2f4f7;
    --text: #11161c;
    --muted: #667085;
    --line: #e3e7ee;
    --accent: #4d6bfe;
    --danger: #d92d20;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    height: 28px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    cursor: pointer;
  }
  button:hover { background: var(--surface); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.05); }
  button.danger { color: var(--danger); }
  input.text, select {
    height: 28px;
    padding: 0 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .brand { font-size: 15px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
  .brand small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 6px; }
  .capture { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 260px; }
  .capture input.text { width: min(420px, 46vw); font-family: var(--mono); font-size: 12px; }
  .status { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.error { color: var(--danger); }
  .status.ok { color: #067647; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: nowrap; }
  .top-actions button { white-space: nowrap; flex: 0 0 auto; }
  .layout {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 248px 6px 260px 6px minmax(320px, 1fr) 6px 300px;
    gap: 0;
  }
  .splitter {
    width: 6px;
    cursor: col-resize;
    background: var(--bg);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    touch-action: none;
  }
  .splitter:hover, .splitter.dragging { background: #e4eaf6; }
  .panel.hidden, .components.hidden { width: 0; min-width: 0; max-width: 0; padding: 0; margin: 0; border: 0; overflow: hidden; visibility: hidden; }
  .collapse-btn { color: var(--muted); }
  .collapse-btn:hover { color: var(--text); background: var(--surface); }
  .splitter.hidden { width: 0; min-width: 0; opacity: 0; pointer-events: none; }
  .splitter::after {
    content: '';
    display: block;
    width: 2px;
    height: 28px;
    margin: 12px auto 0;
    border-radius: 2px;
    background: var(--line);
  }
  .splitter:hover::after { background: var(--accent); }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 14px 8px;
  }
  .panel-head h2 { padding: 0; min-width: 0; }
  .icon-btn { height: 22px; min-width: 24px; padding: 0 6px; border-radius: 6px; font-size: 12px; }
  .toggles { display: flex; align-items: center; gap: 4px; }
  .toggles button { height: 24px; padding: 0 8px; font-size: 11px; border-radius: 6px; color: var(--muted); }
  .toggles button.on { color: var(--text); background: var(--surface); }
  .exit-focus { display: none; }
  body.focus-mode .top .capture, body.focus-mode .top .toggles { display: none; }
  body.focus-mode .exit-focus { display: inline-flex; }
  body.focus-mode .layout { grid-template-columns: 1fr !important; }
  body.focus-mode .layout > * { display: none !important; }
  body.focus-mode .layout > .focus-target { display: block !important; overflow: auto; }
  body.focus-mode .layout > .canvas.focus-target { display: flex !important; flex-direction: column; overflow: hidden; }

  .panel, .components, .canvas { min-height: 0; overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .canvas { display: flex; flex-direction: column; background: var(--surface); border-right: none; overflow: hidden; }
  .panel h2, .components h2 {
    margin: 0;
    padding: 12px 14px 8px;
    font-size: 12px;
    font-weight: 650;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .inspector h2 { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
  .library-list { display: flex; flex-direction: column; gap: 4px; padding: 0 8px 16px; }
  .lib-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left; padding: 7px 8px; height: auto;
    border: 1px solid transparent; border-radius: 8px; background: transparent;
  }
  .lib-item.selected { border-color: var(--accent); background: #eef2ff; }
  .lib-thumb { width: 28px; height: 28px; border-radius: 6px; flex: 0 0 auto; object-fit: cover; border: 1px solid var(--line); }
  .lib-meta { min-width: 0; }
  .lib-label { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-sub { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 8px; }
  .lib-filters button { height: 22px; padding: 0 7px; font-size: 10px; border-radius: 6px; color: var(--muted); }
  .lib-filters button.on { color: var(--text); background: var(--surface); }
  .lib-card { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; }
  .lib-card:hover { background: var(--surface); }
  .lib-card.selected { border-color: var(--accent); background: #eef2ff; }
  .lib-row { display: flex; align-items: center; gap: 7px; }
  .lib-actions { display: flex; gap: 2px; margin-left: auto; }
  .lib-actions button { height: 20px; min-width: 20px; padding: 0 4px; font-size: 11px; border-radius: 5px; color: var(--muted); }
  .lib-actions button.on { color: #b54708; }
  .lib-tags { display: flex; flex-wrap: wrap; gap: 3px; padding-left: 35px; }
  .lib-tags .chip { font-size: 9px; padding: 1px 5px; }
  .theme-list { display: flex; flex-direction: column; gap: 6px; }
  .theme-item { display: flex; align-items: center; gap: 6px; font-size: 11px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .theme-item .theme-name { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .theme-item button { height: 20px; padding: 0 5px; font-size: 10px; border-radius: 5px; }
  .layer-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; font-size: 11px; color: var(--text); cursor: pointer; }
  .layer-row:hover { background: var(--surface); }
  .layer-row.selected { background: #eef2ff; box-shadow: inset 0 0 0 1px var(--accent); }
  .layer-grip { color: var(--muted); font-size: 10px; user-select: none; }
  .layer-type { flex: 0 0 auto; padding: 0 5px; border-radius: 4px; background: var(--surface); color: var(--muted); font-size: 9px; line-height: 16px; }
  .layer-name { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 10px; }
  .layer-row.overlay .layer-type { background: #fef0c7; color: #b54708; }
  .layer-eye { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 11px; padding: 0 2px; }
  .layer-eye.on { color: var(--text); }
  .region-card.selected, .block.selected, .slot.selected { box-shadow: 0 0 0 2px var(--accent); }
  .region-card.layer-hidden { opacity: .45; }
  .layer-row.drop-ok { background: #e0e7ff; box-shadow: inset 0 0 0 1px var(--accent); }
  .layer-drop-root { margin: 8px; padding: 10px; text-align: center; font-size: 10px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
  .layer-drop-root.drop-ok { border-color: var(--accent); color: var(--accent); background: #f5f8ff; }
  .overlay-guide { position: absolute; pointer-events: none; z-index: 9; background: var(--accent); opacity: .45; }
  .overlay-guide.v { top: 0; bottom: 0; width: 1px; }
  .overlay-guide.h { left: 0; right: 0; height: 1px; }
  .artboard { position: relative; }
  .region-card.overlay { position: absolute; z-index: 3; box-shadow: 0 4px 14px rgba(16,24,40,.14); border-color: transparent; }
  .region-card.overlay.selected { border-color: #b54708; box-shadow: 0 0 0 2px #fef0c7; }
  .region-card.overlay .region-type { color: #b54708; white-space: nowrap; }
  .region-card.overlay .region-head { cursor: move; flex-wrap: wrap; gap: 4px; }
  .region-card.overlay .region-actions button { font-size: 9px; padding: 0 4px; }
  .slot { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .slot-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .slot-num { width: 20px; height: 20px; border-radius: 6px; background: var(--surface); color: var(--muted); font: 10px var(--mono); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .slot-label { font-size: 12px; font-weight: 600; color: var(--text); }
  .slot-hint { font-size: 10px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .slot-state { font-size: 10px; color: var(--muted); padding: 1px 6px; border-radius: 5px; background: var(--surface); flex: 0 0 auto; }
  .slot.filled .slot-state { color: #067647; background: #e7f6ec; }
  .slot-actions { margin-left: auto; display: flex; gap: 4px; flex: 0 0 auto; }
  .slot-body { position: relative; overflow: hidden; background: #fff; }
  .slot-empty {
    margin: 10px; padding: 22px 14px; border: 1px dashed var(--line); border-radius: 10px;
    background: var(--bg); color: var(--muted); font-size: 12px; text-align: center; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .slot-empty:hover { border-color: var(--accent); color: var(--accent); background: #f5f8ff; }
  .slot-empty .plus { font-size: 16px; line-height: 1; color: var(--muted); }
  .slot-empty:hover .plus { color: var(--accent); }
  .slot-col { display: flex; flex-direction: column; }
  .slot-col > * { flex: 0 0 auto; }
  .slot-grip { cursor: grab; color: var(--muted); font-size: 11px; letter-spacing: -1px; padding: 0 2px; user-select: none; }
  .slot-grip:active { cursor: grabbing; }
  .slot.dragging { opacity: .5; }
  .slot-gap { height: 8px; margin: -2px 6px; border-radius: 4px; transition: height .08s, background .08s; }
  .slot-gap.drop-ok { height: 18px; background: #e0e7ff; border: 1px dashed var(--accent); }
  .slot-style { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px dashed var(--line); font-size: 10px; color: var(--muted); }
  .slot-style button { height: 20px; padding: 0 6px; font-size: 10px; border-radius: 5px; }
  .slot-style button.on { background: var(--surface); color: var(--text); }
  .artboard { width: 100%; transition: max-width .15s; margin: 0 auto; background: #fff; border: 1px solid #d0d5dd; border-radius: 12px; box-shadow: 0 10px 30px rgba(16,24,40,.14); padding: 6px; min-height: 620px; }
  .canvas-scroll { background: #eef1f5; border-radius: 10px; }
  .region-insert-line { grid-column: 1 / -1; height: 2px; background: var(--accent); border-radius: 2px; position: relative; }
  .region-insert-line::before { content: '插入到这里'; position: absolute; left: 0; top: -16px; font-size: 9px; color: var(--accent); background: var(--panel); padding: 1px 4px; border-radius: 4px; }
  .artboard.desktop { max-width: 100%; }
  .artboard.tablet { max-width: 768px; }
  .artboard.mobile { max-width: 375px; }
  .region-grid { display: grid; gap: 8px; align-items: start; padding: 2px; background: transparent; border: 0; border-radius: 0; min-height: 220px; }
  .region-grid > .canvas-empty { grid-column: 1 / -1; }
  .artboard.drop-active { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 12px; }
  .region-grid.nested { padding: 8px; gap: 8px; background: var(--bg); border-radius: 8px; border-style: dashed; min-height: 60px; }
  .region-card.child { border-style: dashed; }
  .region-card.child .region-type { font-size: 10px; }
  .region-card.child .region-head { flex-wrap: wrap; gap: 4px; }
  .region-card.child .region-actions { margin-left: auto; }
  .region-card.child .region-actions button { font-size: 9px; padding: 0 4px; }
  .region-grid.nested { align-items: start; }
  .region-card { position: relative; border: 1px solid transparent; border-radius: 8px; background: transparent; overflow: visible; display: flex; flex-direction: column; min-height: 0; min-width: 0; container-type: inline-size; }
  .region-card.filled { border-color: transparent; }
  .region-card:not(.filled):not(.container) { border: 1px dashed #e4e7ec; min-height: 88px; }
  .region-card:hover { border-color: #d0d5dd; }
  .region-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px #e0e7ff; background: var(--panel); }
  .region-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 3px 6px; border: 0; background: transparent; font-size: 10px; color: var(--muted); flex: 0 0 auto; min-width: 0; border-radius: 6px 6px 0 0; }
  .region-card.selected .region-head { background: var(--panel); border-bottom: 1px solid var(--line); }
  .region-card:not(.selected) .region-meta,
  .region-card:not(.selected) .region-actions,
  .region-card:not(.selected) .bp-badge { display: none; }
  .region-grip { cursor: grab; user-select: none; color: var(--muted); flex: 0 0 auto; }
  .region-type { font-weight: 600; color: var(--text); font-size: 11px; white-space: nowrap; flex: 0 0 auto; }
  .region-meta { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
  .region-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 3px; flex: 0 1 auto; }
  .region-actions button { height: 20px; padding: 0 5px; font-size: 10px; border-radius: 5px; white-space: nowrap; }
  @container (max-width: 340px) {
    .region-head { gap: 3px 6px; }
    .region-type { font-size: 10px; }
    .region-actions button { height: 18px; font-size: 9px; padding: 0 4px; }
    .region-meta { font-size: 9px; }
  }
  .region-body { position: relative; flex: 1 1 auto; overflow: hidden; background: #fff; }
  .region-empty { padding: 22px 12px; text-align: center; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; margin: 8px; }
  .region-card.drop-ok { border-color: var(--accent); box-shadow: 0 0 0 2px #c7d2fe; }
  .region-card.dragging { opacity: .55; }
  .region-resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--muted) 50%); opacity: .6; }
  .region-resize:hover { opacity: 1; }
  .region-breakpoints { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px dashed var(--line); font-size: 10px; color: var(--muted); }
  .region-breakpoints select { height: 20px; font-size: 10px; border-radius: 4px; }
  .region-breakpoints label { display: inline-flex; align-items: center; gap: 3px; }
  .region-card.bp-hidden { opacity: .45; }
  .region-card .bp-badge { font-size: 9px; color: #b54708; background: #fef0c7; padding: 1px 5px; border-radius: 4px; }
  .picker { border: 1px solid var(--accent); border-radius: 12px; background: var(--panel); margin-bottom: 12px; overflow: hidden; box-shadow: 0 6px 18px rgba(16,24,40,.08); }
  .picker-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; }
  .picker-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px; max-height: 380px; overflow: auto; }
  .picker-card { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
  .picker-card img, .picker-card .noimg { height: 84px; object-fit: cover; object-position: top; display: block; background: var(--surface); width: 100%; }
  .picker-meta { display: flex; align-items: center; gap: 5px; padding: 6px 8px; font-size: 10px; color: var(--muted); min-width: 0; }
  .picker-meta span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .picker-card button { margin: auto 8px 8px; }
  .dragging-item .slot:not(.drop-ok) { opacity: .55; }
  body.dragging-item iframe { pointer-events: none; }
  body.dragging-item .region-card { cursor: copy; }
  .region-card.drop-bad { border-color: #d92d20; box-shadow: 0 0 0 2px #fecdca; }
  .slot.drop-ok { border-color: var(--accent); box-shadow: 0 0 0 2px #c7d2fe; }
  .slot.drop-ok .slot-body, .slot.drop-ok .slot-empty { background: #f5f8ff; }
  .lib-card[draggable="true"], .specimen-wrap[draggable="true"], .asset-tile[draggable="true"] { cursor: grab; }
  .canvas-col.drop-active { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 10px; }
  .component-groups { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 14px; }
  .group-title { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .group-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sample-card { min-width: 120px; max-width: 200px; padding: 10px 12px; }
  .sample-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; background: var(--surface); font: 10px var(--mono); color: var(--muted); }
  .canvas-head {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted); flex: 0 0 auto;
  }
  .canvas-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .zoom-ctl { display: inline-flex; align-items: center; gap: 2px; }
  .zoom-ctl button { height: 24px; padding: 0 6px; font-size: 11px; }
  .zoom-ctl button.on { color: var(--accent); background: #eef2ff; }
  .canvas-subhead {
    padding: 5px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    font-size: 10px; color: var(--muted); display: flex; gap: 10px; align-items: center;
  }
  .ctl-sep { width: 1px; height: 18px; background: var(--line); display: inline-block; }
  .ghost { height: 24px; padding: 0 9px; font-size: 11px; border-radius: 6px; color: var(--muted); background: transparent; }
  .ghost:hover { color: var(--text); background: var(--surface); }
  .canvas-head strong { color: var(--text); font-weight: 600; }
  .canvas-wrap { flex: 1 1 auto; min-height: 0; padding: 12px; }
  .canvas-scroll { height: 100%; display: flex; gap: 10px; overflow: auto; background-color: #e3e8ef; background-image: radial-gradient(#c9d1dc 1px, transparent 1px); background-size: 18px 18px; border-radius: 10px; }
  .canvas-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .canvas-col > * { flex: 0 0 auto; }
  .block { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .block-bar { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .block-kind { flex: 0 0 auto; padding: 1px 6px; border-radius: 5px; background: var(--surface); font: 10px var(--mono); color: var(--muted); }
  .block-title { flex: 1 1 auto; min-width: 0; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block-actions { display: flex; gap: 3px; }
  .block-actions button { height: 20px; min-width: 22px; padding: 0 5px; font-size: 10px; }
  .block-body { position: relative; overflow: hidden; background: #fff; }
  .block-frame { width: 100%; border: 0; display: block; background: #fff; }
  .block:active, .block[draggable="true"]:hover { outline: 1px dashed var(--accent); outline-offset: -1px; }
  .canvas-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  #canvas-hint { flex: 0 0 auto; white-space: nowrap; }
  .canvas-controls select { height: 24px; font-size: 11px; border-radius: 6px; max-width: 220px; }
  .canvas-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; color: var(--muted); font-size: 12px; background: var(--panel); }
  .canvas-export { display: none; padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 11px; gap: 10px; align-items: center; flex-wrap: wrap; }
  .canvas-export.show { display: flex; }
  .canvas-export a { color: var(--accent); text-decoration: none; }
  .canvas-export a:hover { text-decoration: underline; }
  .mini { height: 20px; padding: 0 6px; font-size: 10px; border-radius: 6px; flex: 0 0 auto; }
  .specimen-wrap { display: inline-flex; align-items: center; gap: 4px; }
  #preview { width: 100%; height: 100%; border: 0; border-radius: var(--radius); background: #fff; display: block; }
  .inspector { overflow: auto; }
  .inspect-body { padding: 0 14px 24px; display: flex; flex-direction: column; gap: 16px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; }
  .kv span:first-child { color: var(--muted); }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .swatch { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .swatch .fill { height: 30px; }
  .swatch .cap { padding: 6px 8px; font-size: 10px; color: var(--muted); }
  .swatch .cap b { display: block; color: var(--text); font: 10px var(--mono); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--surface); font: 10px var(--mono); color: var(--muted); }
  .tabs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .tabs button { height: 22px; padding: 0 8px; border: 0; background: transparent; border-radius: 6px; font-size: 11px; }
  .tabs button.on { background: var(--panel); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .tab-new { margin-left: 4px; padding: 0 4px; border-radius: 4px; background: #e7f6ec; color: #067647; font-size: 9px; line-height: 14px; vertical-align: 1px; }
  .mode-chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 6px; background: var(--panel); box-shadow: 0 1px 2px rgba(16,24,40,.08); font-size: 11px; color: var(--text); font-weight: 600; }
  .asset-filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 12px 8px; }
  .asset-filters button { height: 22px; padding: 0 8px; font-size: 10px; border-radius: 6px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); }
  .asset-filters button.on { color: var(--text); border-color: var(--accent); background: #eef2ff; }
  .comp-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 0 12px 6px; align-self: stretch; width: calc(100% - 24px); box-sizing: border-box; }
  .comp-tabs button { min-width: 0; height: 22px; padding: 0 6px; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp-tabs .tab-count { margin-left: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .comp-tabs button.on .tab-count { color: var(--text); }
  #panel-components { container-type: inline-size; }
  @container (max-width: 200px) {
    .comp-tabs .tab-count { display: none; }
    .comp-tabs button { padding: 0 4px; }
  }
  .export-out { display: flex; flex-direction: column; gap: 6px; font-size: 11px; word-break: break-all; }
  .export-out a { color: var(--accent); }
  .warn { font-size: 11px; color: #b54708; line-height: 1.6; }
  .banner {
    display: none;
    padding: 8px 16px;
    background: #fff7e6;
    border-bottom: 1px solid #f5d9a8;
    color: #8a5a00;
    font-size: 12px;
  }
  .banner.show { display: block; }
  .empty { padding: 20px 14px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .hint { font-size: 10px; color: var(--muted); line-height: 1.6; }
  /* Page content uses the same geometry as the exported page. */
  .artboard { padding:0; border:0; outline:1px solid #d0d5dd; border-radius:0; }
  .region-grid { padding:16px; gap:16px; min-height:0; }
  .region-grid.nested { padding:0; gap:16px; min-height:0; background:transparent; border-radius:0; }
  .region-card, .region-card.child, .region-card:not(.filled):not(.container) { border:0; border-radius:0; }
  .region-body { flex:none; background:transparent; overflow:visible; }
  .region-card.overlay { box-shadow:none; }
  .region-card.selected { background:transparent; }
  .region-head { position:absolute; top:0; left:0; z-index:10; opacity:0; pointer-events:none; max-width:100%; background:var(--panel); }
  .region-card:hover > .region-head, .region-card.selected > .region-head { opacity:1; pointer-events:auto; }
  .region-breakpoints { position:absolute; top:28px; left:0; z-index:11; background:var(--panel); }
  .region-content { line-height:1.6; overflow-wrap:anywhere; }
  .region-content img { display:block; max-width:100%; height:auto; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">采风 StyleScout <small>V2 · 模块拼装工作台</small></div>
  <div class="capture">
    <input id="url" class="text" placeholder="https://linear.app/" spellcheck="false" />
    <button id="capture" class="primary">采集</button>
    <span id="status" class="status"></span>
  </div>
  <div class="top-actions">
    <div class="toggles" aria-label="面板显示">
      <button data-toggle="library" title="显示/隐藏资产库">资产库</button>
      <button data-toggle="components" title="显示/隐藏组件">组件</button>
      <button data-toggle="inspector" title="显示/隐藏检查器">检查器</button>
      <button id="focus-canvas" title="隐藏/恢复三个侧栏，专注画布">专注画布</button>
    </div>
    <button id="refresh" title="重新读取资产库">刷新</button>
    <span id="draft-status" role="status" style="font-size:11px"></span>
    <button id="retry-draft" hidden>重试保存</button>
    <button id="backup" title="备份资产库和当前画布草稿">备份</button>
    <button class="exit-focus" onclick="location.href='/style-scout/'">退出独立窗口</button>
  </div>
</header>
<div id="banner" class="banner"></div>
<main class="layout" id="layout">
  <aside class="panel library" id="panel-library">
    <div class="panel-head">
      <h2>资产库 <span id="count" class="chip">0</span></h2>
      <span style="display:flex;gap:4px;align-items:center">
        <button class="icon-btn collapse-btn" data-collapse="library" title="隐藏资产库（顶部按钮可恢复）">⟨</button>
        <button class="icon-btn" data-pop="library" title="独立窗口打开资产库">⤢</button>
      </span>
    </div>
    <div id="lib-filters" class="lib-filters"></div>
    <div id="library" class="library-list"></div>
  </aside>
  <div class="splitter" data-edge="lib" title="拖动调整宽度；双击复位"></div>
  <section class="components" id="panel-components">
    <div class="panel-head" style="flex-direction:column;align-items:stretch;gap:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <h2>素材</h2>
        <span style="display:flex;gap:4px;align-items:center">
          <button class="icon-btn collapse-btn" data-collapse="components" title="隐藏素材面板（顶部按钮可恢复）">⟨</button>
          <button class="icon-btn" data-pop="components" title="独立窗口打开面板">⤢</button>
        </span>
      </div>
      <div class="tabs comp-tabs" id="comp-tabs" role="tablist">
        <button data-tab="assets" role="tab">素材</button>
        <button data-tab="layers" role="tab">图层</button>
      </div>
    </div>
    <div id="components" class="component-groups"></div>
  </section>
  <div class="splitter" data-edge="comp" title="拖动调整宽度；双击复位"></div>
  <section class="canvas" id="panel-canvas">
    <div class="canvas-head">
      <div class="canvas-controls">
        <div class="tabs" id="canvas-mode" role="tablist" style="display:none"></div>
        <span class="mode-chip">区域画布</span>
        <select id="template-select" aria-label="页面模板"></select>
        <button id="autofill" class="ghost" title="用资产库自动填满空位">一键填充</button>
        <button id="save-template" class="ghost" title="把当前空位表保存为模板">存为模板</button>
        <button id="delete-template" class="ghost" style="display:none" title="删除当前自定义模板">删模板</button>
        <button id="export-template" class="ghost" title="导出模板 JSON（并同步到 host）">导出模板</button>
        <button id="import-template" class="ghost" title="从 host 模板目录或 JSON 文件导入">导入模板</button>
        <span class="ctl-sep" id="region-sep" style="display:none"></span>
        <select id="artboard" aria-label="画布尺寸" style="display:none">
          <option value="desktop">桌面 1440</option>
          <option value="tablet">平板 768</option>
          <option value="mobile">手机 375</option>
        </select>
        <select id="region-type" aria-label="新建区域类型" style="display:none">          <option value="nav">导航</option>
          <option value="hero">Hero</option>
          <option value="features">特性区</option>
          <option value="pricing">定价区</option>
          <option value="gallery">画廊</option>
          <option value="footer">页脚</option>
          <option value="free">自由区域</option>
          <option value="container">容器（嵌套）</option>
          <option value="overlay">叠加层（局部绝对定位）</option>
        </select>
        <span class="zoom-ctl" id="zoom-ctl">
          <button id="zoom-out" class="ghost" title="缩小">−</button>
          <button id="zoom-label" class="ghost" style="min-width:46px;text-align:center" title="点击重置 100%">100%</button>
          <button id="zoom-in" class="ghost" title="放大">＋</button>
          <button id="zoom-wheel" class="ghost" title="滚轮：缩放 / 滚动切换（Shift+滚轮始终滚动）">滚轮缩放</button>
          <button id="zoom-fit" class="ghost" title="缩放到适应画布宽度">适应</button>
        </span>
        <button id="add-region" class="ghost" style="display:none">新建区域</button>
        <button id="export-layout" class="ghost" style="display:none" title="导出区域布局 JSON（并同步到 host）">导出布局</button>
        <button id="ai-layout" class="ghost" style="display:none" title="从 host 导入 AI 分区布局">AI 分区</button>
        <button id="ai-generate" class="ghost" style="display:none" title="生成给 AI 的布局提示词（素材目录 + layer@1 规范 + 自检流程）">AI 生成</button>
        <span class="ctl-sep"></span>
        <select id="skin-a" aria-label="画布皮肤 A"></select>
        <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="split-toggle" /> A/B</label>
        <select id="skin-b" aria-label="画布皮肤 B" style="display:none"></select>
        <button id="canvas-clear" class="ghost" title="清空画布">清空</button>
      </div>
      <div class="canvas-actions">
        <input id="export-dir" class="text" placeholder="写入目录 / 目标 git 项目目录" spellcheck="false" style="height:26px;width:180px;font-size:11px" />
        <button id="export-page" class="primary" style="height:26px;padding:0 10px;font-size:11px">导出拼装页</button>
        <button id="export-project" class="ghost" style="height:26px" title="导出到目标 git 项目的独立分支（worktree，不动当前分支）">导出到项目</button>
        <button class="icon-btn" data-pop="canvas" title="独立窗口打开画布">⤢</button>
      </div>
    </div>
    <div class="canvas-subhead"><span id="canvas-hint">—</span></div>
    <div id="canvas-export" class="canvas-export"></div>
    <input id="template-file" type="file" accept="application/json,.json" style="display:none" />
    <input id="layout-file" type="file" accept="application/json,.json" style="display:none" />
    <div class="canvas-wrap">
      <div id="canvas-scroll" class="canvas-scroll">
        <div id="canvas-a" class="canvas-col"></div>
        <div id="canvas-b" class="canvas-col"></div>
      </div>
    </div>
  </section>
  <div class="splitter" data-edge="insp" title="拖动调整宽度；双击复位"></div>
  <aside class="panel inspector" id="panel-inspector">
    <div class="panel-head">
      <h2>检查器</h2>
      <span style="display:flex;gap:4px;align-items:center">
        <button class="icon-btn collapse-btn" data-collapse="inspector" title="隐藏检查器（顶部按钮可恢复）">⟩</button>
        <button class="icon-btn" data-pop="inspector" title="独立窗口打开检查器">⤢</button>
      </span>
    </div>
    <div id="inspector" class="inspect-body"></div>
    <h2>导出</h2>
    <div class="inspect-body" style="gap:8px">
      <button id="export" class="primary">导出 theme.css + tokens.json</button>
      <div id="export-out" class="export-out"></div>
      <div class="hint">V2-4 会追加 components/*.html+css 与整页 index.html，并可写入项目目录。</div>
    </div>
    <h2>我的主题</h2>
    <div class="inspect-body" style="gap:8px">
      <button id="save-theme" class="primary">保存当前皮肤为主题</button>
      <div id="theme-list" class="theme-list"></div>
      <div class="hint">同名再次保存会累加版本（最多保留 5 版），可恢复上一版。</div>
    </div>
  </aside>
</main>
<script>
(() => {
  'use strict'

  /* ---------- state ---------- */
  const state = {
    entries: [],
    selectedId: null,
    layer: 'dark',
    demo: false,
    status: '',
    compTab: (() => {
      try { return localStorage.getItem('ss.compTab') === 'layers' ? 'layers' : 'assets' } catch { return 'assets' }
    })(),
    assetFilter: 'all',
    favoriteOnly: false,
    tagFilter: null,
    themes: [],
    customTemplates: [],
    slotEdit: null,
    hostTemplates: [],
    templateImport: false,
    hostLayouts: [],
    layoutImport: false,
    aiPrompt: false,
    breakpointEdit: null,
    selectedLayer: null,
    canvasZoom: (() => {
      try {
        const zoom = Number(localStorage.getItem('ss.zoom.v2'))
        return zoom >= 0.25 && zoom <= 3 ? zoom : 1
      } catch { return 1 }
    })(),
    wheelZoom: (() => {
      try { return localStorage.getItem('ss.wheelZoom') !== '0' } catch { return true }
    })(),
  }

  const $ = (id) => document.getElementById(id)
  const el = (tag, props, children) => {
    const node = document.createElement(tag)
    if (props) {
      for (const [key, value] of Object.entries(props)) {
        if (key === 'class') node.className = value
        else if (key === 'style' && value && typeof value === 'object') Object.assign(node.style, value)
        else if (key === 'text') node.textContent = value
        else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2).toLowerCase(), value)
        else if (value !== null && value !== undefined) node.setAttribute(key, String(value))
      }
    }
    for (const child of [].concat(children || [])) {
      if (child === null || child === undefined) continue
      node.append(child instanceof Node ? child : document.createTextNode(String(child)))
    }
    return node
  }

  function setStatus(text, tone) {
    state.status = text || ''
    const node = $('status')
    node.textContent = state.status
    node.className = 'status' + (tone ? ' ' + tone : '')
  }

  function hostOf(url) {
    try { return new URL(url).host } catch { return String(url || '') }
  }

  function colorOn(hex) {
    const match = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''))
    if (match === null) return '#ffffff'
    const value = parseInt(match[1], 16)
    const ch = (shift) => {
      let c = (value >> shift) & 255
      c /= 255
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
    }
    const lum = 0.2126 * ch(16) + 0.7152 * ch(8) + 0.0722 * ch(0)
    return lum > 0.45 ? '#0b0b0c' : '#ffffff'
  }

  /* ---------- API ---------- */
  async function api(path, options) {
    const response = await fetch(path, Object.assign({ headers: { accept: 'application/json' } }, options || {}))
    let data
    try {
      data = await response.json()
    } catch {
      throw new Error('响应不是 JSON（host 未连接？）')
    }
    if (!response.ok) throw Object.assign(new Error((data && data.error) || 'HTTP ' + response.status), { status: response.status })
    return data
  }

  async function backupData() {
    const button = $('backup')
    button.disabled = true
    setStatus('正在备份资产库…')
    try {
      await flushDraft()
      const data = await api('/style-scout/api/backup', { method: 'POST' })
      const size = data.sizeBytes > 0 ? ' · ' + (data.sizeBytes / 1024 / 1024).toFixed(1) + ' MB' : ''
      setStatus('已备份：' + data.id + size + ' · ' + data.entries + ' 条资产 · ' + data.themes + ' 个主题（host backups/）', 'ok')
    } catch (error) {
      setStatus('备份失败：' + error.message, 'error')
    } finally {
      button.disabled = false
    }
  }

  async function loadLibrary() {    try {
      const data = await api('/style-scout/api/library')
      const entries = Array.isArray(data.entries) ? data.entries : []
      if (entries.length === 0) {
        state.entries = [DEMO_ENTRY]
        state.selectedId = DEMO_ENTRY.id
        state.demo = true
        showBanner('资产库为空，先显示 demo；输入 URL 采集后刷新即可。')
        renderAll()
        return
      }
      state.entries = entries
      state.demo = false
      hideBanner()
      if (!state.entries.some((entry) => entry.id === state.selectedId)) {
        state.selectedId = state.entries[0].id
      }
      renderAll()
    } catch (error) {
      state.entries = [DEMO_ENTRY]
      state.selectedId = DEMO_ENTRY.id
      state.demo = true
      showBanner('未连接 host（离线预览）。重启 DSH 后从侧栏「采风」打开即可连上资产库。')
      renderAll()
    }
  }

  function showBanner(text) {
    const banner = $('banner')
    banner.textContent = text
    banner.className = 'banner show'
  }
  function hideBanner() { $('banner').className = 'banner' }

  function selectedEntry() {
    return state.entries.find((entry) => entry.id === state.selectedId) || state.entries[0] || null
  }

  function layerKeys(entry) {
    return entry && entry.layers ? Object.keys(entry.layers) : []
  }

  function activeLayerKey(entry) {
    const keys = layerKeys(entry)
    if (keys.length === 0) return 'dark'
    return entry.layers[state.layer] ? state.layer : keys[0]
  }

  /* ---------- theme ---------- */
  function themeVars(entry, layerKey) {
    const vars = {
      '--ss-bg': '#ffffff',
      '--ss-surface': '#f2f4f7',
      '--ss-text': '#11161c',
      '--ss-muted': '#667085',
      '--ss-border': '#e3e7ee',
      '--ss-accent': '#4d6bfe',
      '--ss-on-accent': '#ffffff',
      '--ss-radius': '12px',
      '--ss-space': '1',
      '--ss-motion': '1',
      '--ss-font-display': 'system-ui, sans-serif',
      '--ss-font-body': 'system-ui, sans-serif',
    }
    if (entry) {
      const key = activeLayerKey(entry)
      const layer = (entry.layers && entry.layers[key]) || {}
      const families = entry.families || {}
      const accent = (entry.accent && entry.accent.hex) || layer.text || vars['--ss-accent']
      const display = (families.display && families.display.family) || (families.body && families.body.family) || 'system-ui'
      const body = (families.body && families.body.family) || display
      const radius = (entry.radius && entry.radius.roles && entry.radius.roles.medium) || 12
      if (layer.background) vars['--ss-bg'] = layer.background
      if (layer.surface) vars['--ss-surface'] = layer.surface
      if (layer.text) vars['--ss-text'] = layer.text
      if (layer.muted) vars['--ss-muted'] = layer.muted
      if (layer.border) vars['--ss-border'] = layer.border
      vars['--ss-accent'] = accent
      vars['--ss-on-accent'] = colorOn(accent)
      vars['--ss-radius'] = Math.round(radius) + 'px'
      vars['--ss-font-display'] = '"' + display + '", system-ui, sans-serif'
      vars['--ss-font-body'] = '"' + body + '", system-ui, sans-serif'
    }
    return vars
  }

  function pageThemeVars(entry) {
    const vars = themeVars(entry)
    const theme = draft.theme || {}
    const background = draft.background || theme.background
    if (typeof background === 'string' && CSS.supports('color', background)) vars['--ss-bg'] = background
    if (typeof theme.foreground === 'string' && CSS.supports('color', theme.foreground)) vars['--ss-text'] = theme.foreground
    return vars
  }

  function varsCss(vars) {
    return Object.keys(vars).map((key) => key + ': ' + vars[key] + ';').join('\n  ')
  }

  function buildThemeCss(entry, layerKey) {
    const vars = pageThemeVars(entry)
    return [
      '/* StyleScout theme — generated ' + new Date().toISOString().slice(0, 10) + ' */',
      '/* Source: ' + (entry && entry.source ? entry.source : 'StyleScout') + ' */',
      ':root {',
      '  ' + varsCss(vars),
      '}',
      'body { margin: 0; background: var(--ss-bg); color: var(--ss-text); font-family: var(--ss-font-body); line-height: 1.6; }',
      'h1, h2, h3, h4 { font-family: var(--ss-font-display); line-height: 1.15; color: var(--ss-text); }',
      'a { color: var(--ss-accent); }',
      'button, .ss-button { background: var(--ss-accent); color: var(--ss-on-accent); border: 0; border-radius: var(--ss-radius); padding: calc(10px * var(--ss-space)) calc(18px * var(--ss-space)); font-family: var(--ss-font-body); cursor: pointer; }',
      'input, textarea, select { background: var(--ss-surface); color: var(--ss-text); border: 1px solid var(--ss-border); border-radius: var(--ss-radius); padding: calc(8px * var(--ss-space)) calc(12px * var(--ss-space)); font-family: var(--ss-font-body); }',
      '.ss-card { background: var(--ss-surface); border: 1px solid var(--ss-border); border-radius: var(--ss-radius); padding: calc(16px * var(--ss-space)); }',
      '',
    ].join('\n')
  }

  function buildTokens(entry, layerKey) {
    const key = entry ? activeLayerKey(entry) : null
    const layer = entry && key ? entry.layers[key] : {}
    return {
      schema: 'style-scout/theme@0.1',
      generatedAt: new Date().toISOString(),
      source: entry ? { id: entry.id, url: entry.source } : null,
      layer: key,
      color: {
        background: layer.background || null,
        surface: layer.surface || null,
        text: layer.text || null,
        muted: layer.muted || null,
        border: layer.border || null,
        accent: (entry && entry.accent && entry.accent.hex) || null,
        onAccent: colorOn(entry && entry.accent && entry.accent.hex),
      },
      typography: entry ? { families: entry.families, scale: entry.typeScale } : null,
      spacing: entry ? entry.spacing : null,
      radius: entry ? entry.radius : null,
      overrides: {},
    }
  }

  /* ---------- saved themes (V2-5) ---------- */
  function themeToEntry(theme) {
    const tokens = theme.tokens || {}
    const color = tokens.color || {}
    const families = (tokens.typography && tokens.typography.families) || {}
    const layer = {
      background: color.background,
      surface: color.surface,
      text: color.text,
      muted: color.muted,
      border: color.border,
    }
    return {
      id: 'theme:' + theme.id,
      label: '我的主题 · ' + theme.name,
      source: 'theme:' + theme.name,
      layers: { dark: layer, light: layer },
      families,
      typeScale: (tokens.typography && tokens.typography.scale) || [],
      spacing: tokens.spacing || { baseUnit: 4, scale: [] },
      radius: tokens.radius || { scale: [], roles: {} },
      accent: color.accent ? { hex: color.accent } : null,
      colorMap: theme.colorMap || {},
      themeId: theme.id,
    }
  }

  function resolveSkin(value) {
    if (typeof value === 'string' && value.startsWith('theme:')) {
      const id = value.slice('theme:'.length)
      const theme = state.themes.find((item) => item.id === id)
      return theme ? themeToEntry(theme) : null
    }
    return entryById(value)
  }

  function renderThemes() {
    const host = $('theme-list')
    if (!host) return
    host.textContent = ''
    if (state.themes.length === 0) {
      host.append(el('div', { class: 'hint', text: '还没有保存的主题。调好皮肤后点上面按钮保存。' }))
      return
    }
    for (const theme of state.themes) {
      const versionCount = (theme.versions || []).length
      const item = el('div', { class: 'theme-item' }, [
        el('span', { class: 'theme-name', text: theme.name + (versionCount > 0 ? ' · v' + (versionCount + 1) : '') }),
        el('button', { type: 'button', class: 'mini', text: '应用A', onclick: () => { draft.skinA = 'theme:' + theme.id; saveDraft() } }),
      ])
      if (versionCount > 0) item.append(el('button', { type: 'button', class: 'mini', text: '恢复', onclick: () => restoreTheme(theme.id) }))
      item.append(el('button', { type: 'button', class: 'mini', text: '删除', onclick: () => removeTheme(theme.id) }))
      host.append(item)
    }
  }

  async function loadThemes() {
    try {
      const data = await api('/style-scout/api/themes')
      state.themes = Array.isArray(data.themes) ? data.themes : []
    } catch {
      state.themes = []
    }
    renderThemes()
    updateCanvasHead()
  }

  async function saveCurrentTheme() {
    const entry = selectedEntry()
    if (!entry) { setStatus('先选择一份采集作为皮肤', 'error'); return }
    const name = window.prompt('主题名称', entry.label ? entry.label.slice(0, 20) : '我的主题')
    if (name === null) return
    const clean = name.trim()
    if (clean === '') return
    try {
      await api('/style-scout/api/themes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: clean, tokens: buildTokens(entry), colorMap: entry.colorMap || {}, sourceEntryId: entry.id }),
      })
      await loadThemes()
      setStatus('已保存主题：' + clean, 'ok')
    } catch (error) {
      setStatus('保存主题失败：' + error.message, 'error')
    }
  }

  async function restoreTheme(id) {
    try {
      await api('/style-scout/api/themes/' + encodeURIComponent(id) + '/restore', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ version: 0 }),
      })
      await loadThemes()
      setStatus('已恢复上一版主题', 'ok')
    } catch (error) {
      setStatus('恢复失败：' + error.message, 'error')
    }
  }

  async function removeTheme(id) {
    const theme = state.themes.find((item) => item.id === id)
    if (!theme) return
    if (!window.confirm('删除主题「' + theme.name + '」？')) return
    try {
      await api('/style-scout/api/themes/' + encodeURIComponent(id), { method: 'DELETE' })
      await loadThemes()
      setStatus('已删除主题', 'ok')
    } catch (error) {
      setStatus('删除失败：' + error.message, 'error')
    }
  }

  async function patchEntry(id, patch) {
    try {
      const data = await api('/style-scout/api/captures/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(patch),
      })
      const index = state.entries.findIndex((entry) => entry.id === id)
      if (data.entry && index >= 0) state.entries[index] = data.entry
      renderAll()
    } catch (error) {
      setStatus('更新失败：' + error.message, 'error')
    }
  }

  function renameEntry(entry) {
    const name = window.prompt('重命名资产', entry.label || entry.name || entry.id)
    if (name === null) return
    const clean = name.trim()
    if (clean !== '') patchEntry(entry.id, { name: clean })
  }

  function editTags(entry) {
    const input = window.prompt('标签（逗号分隔）', (entry.tags || []).join(', '))
    if (input === null) return
    const tags = input.split(/[,，]/).map((tag) => tag.trim()).filter(Boolean).slice(0, 12)
    patchEntry(entry.id, { tags })
  }

  /* ---------- canvas draft (V2-3 assembly) ---------- */
  const DRAFT_KEY = 'ss.draft.v2'
  const DRAFT_META_KEY = 'ss.draft.sync.v1'
  const draft = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}')
      return {
        ...saved,
        blocks: Array.isArray(saved.blocks) ? saved.blocks : [],
        skinA: saved.skinA || null,
        skinB: saved.skinB || null,
        split: saved.split === true,
        mode: saved.mode === 'free' ? 'free' : saved.mode === 'template' ? 'template' : 'regions',
        templateId: typeof saved.templateId === 'string' ? saved.templateId : 'landing',
        slots: saved.slots !== null && typeof saved.slots === 'object' ? saved.slots : {},
        slotList: Array.isArray(saved.slotList) ? saved.slotList : null,
        slotStyles: saved.slotStyles !== null && typeof saved.slotStyles === 'object' ? saved.slotStyles : {},
        regions: Array.isArray(saved.regions) ? saved.regions : [],
        artboard: saved.artboard === 'tablet' || saved.artboard === 'mobile' ? saved.artboard : 'desktop',
      }
    } catch {
      return { blocks: [], skinA: null, skinB: null, split: false, mode: 'regions', templateId: 'landing', slots: {}, slotList: null, slotStyles: {}, regions: [], artboard: 'desktop' }
    }
  })()
  let dragBlockId = null

  let draftRevision = 0
  let draftReady = false
  let draftDirty = false
  let draftConflict = false
  let draftSaving = null
  let draftOperation = null
  let draftLocalFailed = false

  function draftStatus(message, failed = false) {
    $('draft-status').textContent = message
    $('draft-status').style.color = failed ? '#b42318' : 'var(--muted)'
    $('retry-draft').hidden = !failed
  }

  function cacheDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft))
      localStorage.setItem(DRAFT_META_KEY, JSON.stringify({ revision: draftRevision, dirty: draftDirty, operationId: draftOperation }))
      draftLocalFailed = false
    } catch { draftLocalFailed = true }
  }

  function showDraftConflict() {
    draftConflict = true
    draftStatus('发现另一份草稿，请选择保留哪份', true)
    const banner = $('banner')
    banner.className = 'banner show'
    banner.replaceChildren(document.createTextNode('另一窗口已保存不同内容。当前画布暂不覆盖它。 '),
      el('button', { text: '保留当前画布', onclick: async () => {
        try {
          // Re-read before resolving; a further concurrent save is still rejected.
          const latest = await api('/style-scout/api/draft')
          draftRevision = latest.revision
          draftConflict = false
          draftOperation = crypto.randomUUID()
          draftDirty = true
          cacheDraft()
          hideBanner()
          flushDraft().catch(() => {})
        } catch (err) { draftStatus('读取失败，请重试：' + err.message, true) }
      } }),
      el('button', { text: '读取已保存画布', onclick: async () => {
        try {
          const latest = await api('/style-scout/api/draft')
          if (!latest.draft) return
          Object.keys(draft).forEach((key) => delete draft[key])
          Object.assign(draft, latest.draft)
          draftRevision = latest.revision
          draftConflict = false
          draftDirty = false
          cacheDraft()
          hideBanner()
          renderCanvas()
          draftStatus('已读取本机草稿')
        } catch (err) { draftStatus('读取失败，请重试：' + err.message, true) }
      } }))
  }

  async function restoreDraft() {
    draftStatus('正在读取草稿…')
    let meta = {}
    let hasLocal = false
    try {
      meta = JSON.parse(localStorage.getItem(DRAFT_META_KEY) || '{}')
      hasLocal = Boolean(localStorage.getItem(DRAFT_KEY))
    } catch {}
    const remote = await api('/style-scout/api/draft', { signal: AbortSignal.timeout(8000) })
    draftReady = true
    draftRevision = remote.revision
    if (remote.draft && JSON.stringify(remote.draft) !== JSON.stringify(draft) && ((meta.dirty && meta.revision !== remote.revision) || (hasLocal && meta.revision === undefined))) {
      draftDirty = true
      showDraftConflict()
      return
    }
    if (remote.draft && !meta.dirty) {
      Object.keys(draft).forEach((key) => delete draft[key])
      Object.assign(draft, remote.draft)
    }
    draftDirty = Boolean(meta.dirty) || (!remote.draft && hasLocal)
    draftOperation = meta.operationId || crypto.randomUUID()
    cacheDraft()
    draftStatus(draftDirty ? '正在保存草稿…' : '草稿已就绪')
  }

  function flushDraft() {
    if (draftSaving) return draftSaving
    if (!draftReady || draftConflict) return Promise.reject(new Error('草稿尚未恢复或存在版本冲突'))
    draftSaving = (async () => {
      while (draftDirty) {
        const snapshot = JSON.stringify(draft)
        const operationId = draftOperation || crypto.randomUUID()
        draftStatus('正在保存草稿…')
        try {
          const result = await api('/style-scout/api/draft', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ draft: JSON.parse(snapshot), baseRevision: draftRevision, operationId }),
            signal: AbortSignal.timeout(10000),
          })
          draftRevision = result.revision
          draftDirty = snapshot !== JSON.stringify(draft)
          cacheDraft()
          if (!draftDirty) draftStatus('草稿已保存到本机')
        } catch (error) {
          if (error.status === 409) {
            draftConflict = true
            showDraftConflict()
          } else draftStatus('草稿未保存到本机，请重试' + (draftLocalFailed ? '（浏览器暂存也失败）' : '（已在当前浏览器暂存）'), true)
          throw error
        }
      }
    })().finally(() => { draftSaving = null })
    return draftSaving
  }

  function saveDraft() {
    draftDirty = true
    draftOperation = crypto.randomUUID()
    cacheDraft()
    if (draftReady && !draftConflict) flushDraft().catch(() => {})
    else draftStatus('草稿尚未保存到本机，请重试', true)
    renderCanvas()
  }

  function entryById(id) {
    return state.entries.find((entry) => entry.id === id) || null
  }

  function nextBlockId() {
    return 'blk_' + Date.now().toString(36) + Math.floor(Math.random() * 1000)
  }

  function miniBtn(label, handler) {
    return el('button', { type: 'button', class: 'mini', text: label, onclick: handler })
  }

  function addSectionBlock(entry, section) {
    const block = {
      id: nextBlockId(),
      type: 'section',
      captureId: entry.id,
      sectionId: section.id,
      label: (entry.label || entry.id) + ' · ' + (section.kind || 'section'),
      kindLabel: section.kind || 'section',
      bbox: section.bbox || null,
    }
    if (draft.mode === 'regions') {
      createRegionFromItem({ type: 'section', captureId: entry.id, sectionId: section.id, kind: section.kind || 'section', label: block.label, bbox: section.bbox || null })
      return
    }
    draft.blocks.push(block)
    saveDraft()
    setStatus('已加入画布：' + (section.kind || 'section'), 'ok')
  }

  function addAtomBlock(entry, group, item) {
    const atom = { text: item.text || '', style: item.style || {} }
    if (draft.mode === 'regions') {
      createRegionFromItem({ type: 'atom', captureId: entry.id, kind: group, label: (entry.label || entry.id) + ' · ' + group, atom })
      return
    }
    draft.blocks.push({
      id: nextBlockId(),
      type: 'atom',
      captureId: entry.id,
      label: (entry.label || entry.id) + ' · ' + group,
      kindLabel: group,
      atom,
    })
    saveDraft()
    setStatus('已加入画布：' + (item.text || group), 'ok')
  }

  function addImageBlock(entry, image) {
    const src = image.thumbUrl || image.src
    const ratio = image.w && image.h ? image.w / image.h : 1.6
    if (draft.mode === 'regions') {
      createRegionFromItem({ type: 'image', captureId: entry.id, kind: 'image', label: (entry.label || entry.id) + ' · 图片', src, ratio })
      return
    }
    draft.blocks.push({
      id: nextBlockId(),
      type: 'image',
      captureId: entry.id,
      label: (entry.label || entry.id) + ' · 图片',
      kindLabel: 'image',
      src,
      ratio,
    })
    saveDraft()
    setStatus('已加入画布：图片', 'ok')
  }

  function removeBlock(id) {
    draft.blocks = draft.blocks.filter((block) => block.id !== id)
    saveDraft()
  }

  function moveBlock(id, delta) {
    const index = draft.blocks.findIndex((block) => block.id === id)
    const target = index + delta
    if (index < 0 || target < 0 || target >= draft.blocks.length) return
    const [item] = draft.blocks.splice(index, 1)
    draft.blocks.splice(target, 0, item)
    saveDraft()
  }

  function duplicateBlock(id) {
    const index = draft.blocks.findIndex((block) => block.id === id)
    if (index < 0) return
    const copy = JSON.parse(JSON.stringify(draft.blocks[index]))
    copy.id = nextBlockId()
    draft.blocks.splice(index + 1, 0, copy)
    saveDraft()
  }

  function reorderBlock(fromId, toId) {
    if (!fromId || fromId === toId) return
    const from = draft.blocks.findIndex((block) => block.id === fromId)
    const to = draft.blocks.findIndex((block) => block.id === toId)
    if (from < 0 || to < 0) return
    const [item] = draft.blocks.splice(from, 1)
    draft.blocks.splice(to, 0, item)
    saveDraft()
  }

  /** Readable export class names: ss-<site>-<n>, mapped from captured classes. */
  function siteSlugForCapture(captureId) {
    const entry = state.entries.find((item) => item.id === captureId)
    if (entry !== undefined && typeof entry.source === 'string') {
      try {
        const host = new URL(entry.source).hostname.replace(/^www\./, '').split('.')[0]
        if (host) return host.replace(/[^a-z0-9-]/gi, '').toLowerCase().slice(0, 16)
      } catch { /* fall through */ }
    }
    return 'site'
  }

  function buildClassMap(captureId, htmlSnippets) {
    const counts = new Map()
    for (const snippet of htmlSnippets) {
      const template = document.createElement('template')
      template.innerHTML = snippet
      for (const node of template.content.querySelectorAll('[class]')) {
        const raw = node.getAttribute('class') || ''
        for (const token of raw.split(/\s+/)) {
          if (token === '') continue
          counts.set(token, (counts.get(token) || 0) + 1)
        }
      }
    }
    const slug = siteSlugForCapture(captureId)
    const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([token]) => token)
    const map = new Map()
    sorted.forEach((token, index) => map.set(token, 'ss-' + slug + '-' + (index + 1)))
    return map
  }

  function renameClassesInHtml(html, classMap) {
    if (classMap === undefined || classMap.size === 0) return html
    const template = document.createElement('template')
    template.innerHTML = html
    for (const node of template.content.querySelectorAll('[class]')) {
      const raw = node.getAttribute('class') || ''
      const next = raw.split(/\s+/).filter(Boolean).map((token) => classMap.get(token) || token)
      node.setAttribute('class', next.join(' '))
    }
    return template.innerHTML
  }

  function renameClassesInCss(css, classMap) {
    if (classMap === undefined || classMap.size === 0) return css
    return css.replace(/\.(-?[_a-zA-Z][-_a-zA-Z0-9]*)/g, (match, name) => {
      const mapped = classMap.get(name)
      return mapped ? '.' + mapped : match
    })
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]))
  }

  /** Find the `}` matching the `{` at `open` (CSS scoper helper). */
  function matchingBrace(text, open) {
    let depth = 0
    for (let index = open; index < text.length; index += 1) {
      if (text[index] === '{') depth += 1
      else if (text[index] === '}') {
        depth -= 1
        if (depth === 0) return index
      }
    }
    return -1
  }

  /**
   * Scope a captured stylesheet to one capture: every selector is prefixed with
   * `.ss-scope-<captureId>` so multiple sites can coexist in one export.
   * @media/@supports recurse; @font-face/@keyframes/@import stay global.
   */
  function scopeCss(cssText, scopeClass) {
    const prefix = '.' + scopeClass
    const prefixSelectors = (prelude) => prelude.split(',').map((part) => {
      let selector = part.trim()
      if (selector === '') return selector
      if (/^(html|body|:root)\b/i.test(selector)) return selector.replace(/^(html|body|:root)\b/i, prefix)
      if (selector.startsWith(prefix)) return selector
      return prefix + ' ' + selector
    }).join(',')
    const processRules = (text) => {
      let index = 0
      const output = []
      while (index < text.length) {
        const open = text.indexOf('{', index)
        if (open === -1) {
          output.push(text.slice(index))
          break
        }
        const prelude = text.slice(index, open).trim()
        const close = matchingBrace(text, open)
        if (close === -1) {
          output.push(text.slice(index))
          break
        }
        const body = text.slice(open + 1, close)
        const lower = prelude.toLowerCase()
        if (lower.startsWith('@media') || lower.startsWith('@supports') || lower.startsWith('@layer') || lower.startsWith('@container')) {
          output.push(prelude + '{' + processRules(body) + '}')
        } else if (lower.startsWith('@')) {
          output.push(prelude + '{' + body + '}')
        } else {
          output.push(prefixSelectors(prelude) + '{' + body + '}')
        }
        index = close + 1
      }
      return output.join('')
    }
    return processRules(cssText)
  }

  function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return '0KB'
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB'
    return (bytes / 1024 / 1024).toFixed(1) + 'MB'
  }

  /** Collapse comments/whitespace without touching calc()/selector semantics. */
  function minifyCss(cssText) {    return cssText
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/\s+/g, ' ')
      .replace(/\s*\{\s*/g, '{')
      .replace(/\s*\}\s*/g, '}')
      .replace(/\s*;\s*/g, ';')
      .replace(/\s*,\s*/g, ',')
      .trim()
  }

  /**
   * Drop scoped rules whose selectors match nothing in the exported markup and
   * dedupe identical rules; keep @font-face and only referenced @keyframes.
   * Returns { css, before, after }.
   */
  function trimCss(scopedCss, scopeClass, htmlSnippets) {
    const before = scopedCss.length
    const scratch = document.createElement('div')
    scratch.className = scopeClass
    scratch.style.cssText = 'position:fixed;left:-99999px;top:0;width:1200px;visibility:hidden'
    scratch.innerHTML = htmlSnippets.join('\n')
    document.body.append(scratch)
    const stripPseudos = (selector) => selector
      .replace(/::?(hover|focus-visible|focus-within|focus|active|visited|link|target|before|after|placeholder|selection|first-line|first-letter|marker|backdrop|file-selector-button)\b(?:\([^)]*\))?/gi, '')
      .replace(/\s+/g, ' ')
      .trim()
    const selectorMatches = (selector) => {
      const probe = stripPseudos(selector)
      if (probe === '') return true
      try {
        return document.querySelector(probe) !== null
      } catch {
        return true
      }
    }
    const seen = new Set()
    const keyframeBlocks = new Map()
    const processRules = (text) => {
      let index = 0
      const output = []
      while (index < text.length) {
        const open = text.indexOf('{', index)
        if (open === -1) break
        const prelude = text.slice(index, open).trim()
        const close = matchingBrace(text, open)
        if (close === -1) break
        const body = text.slice(open + 1, close)
        const lower = prelude.toLowerCase()
        if (lower.startsWith('@media') || lower.startsWith('@supports') || lower.startsWith('@layer') || lower.startsWith('@container')) {
          const inner = processRules(body)
          if (inner.trim() !== '') output.push(prelude + '{' + inner + '}')
        } else if (lower.startsWith('@font-face') || lower.startsWith('@import') || lower.startsWith('@charset')) {
          output.push(prelude + '{' + body + '}')
        } else if (lower.startsWith('@keyframes') || lower.startsWith('@-webkit-keyframes')) {
          const name = prelude.replace(/@(?:-webkit-)?keyframes\s+/i, '').trim()
          keyframeBlocks.set(name, prelude + '{' + body + '}')
        } else if (lower.startsWith('@')) {
          output.push(prelude + '{' + body + '}')
        } else {
          const selectors = prelude.split(',').map((part) => part.trim()).filter(Boolean)
          const keptSelectors = selectors.filter(selectorMatches)
          if (keptSelectors.length === 0) {
            index = close + 1
            continue
          }
          const key = keptSelectors.join(',') + '|' + body
          if (!seen.has(key)) {
            seen.add(key)
            output.push(keptSelectors.join(',') + '{' + body + '}')
          }
        }
        index = close + 1
      }
      return output.join('\n')
    }
    const kept = processRules(scopedCss)
    const animationNames = new Set()
    for (const match of kept.matchAll(/animation(?:-name)?\s*:\s*([^;}]+)/gi)) {
      for (const part of match[1].split(',')) {
        const name = part.trim().split(/\s+/).find((token) => /^[-_a-zA-Z][-_a-zA-Z0-9]*$/.test(token))
        if (name !== undefined) animationNames.add(name)
      }
    }
    let keyframes = ''
    for (const [name, block] of keyframeBlocks) {
      if (animationNames.has(name)) keyframes += block + '\n'
    }
    scratch.remove()
    const css = minifyCss(keyframes + kept)
    return { css, before, after: css.length }
  }

  /** Replace the captured palette colors in CSS/HTML with theme variables. */
  function mapColors(text, entry) {
    const map = (entry && entry.colorMap) || {}
    const keys = Object.keys(map)
    if (keys.length === 0 || typeof text !== 'string') return text
    const lookup = new Map()
    for (const hex of keys) {
      lookup.set(hex.toUpperCase(), map[hex])
      const n = parseInt(hex.replace('#', ''), 16)
      const r = (n >> 16) & 255
      const g = (n >> 8) & 255
      const b = n & 255
      lookup.set(`rgb(${r}, ${g}, ${b})`, map[hex])
      lookup.set(`rgb(${r},${g},${b})`, map[hex])
    }
    return text
      .replace(/#[0-9a-f]{6}\b/gi, (match) => {
        const name = lookup.get(match.toUpperCase())
        return name ? 'var(' + name + ')' : match
      })
      .replace(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*1(?:\.0+)?\s*)?\)/gi, (match, r, g, b) => {
        const hex = '#' + [r, g, b].map((value) => Number(value).toString(16).padStart(2, '0')).join('').toUpperCase()
        const name = lookup.get(hex)
        return name ? 'var(' + name + ')' : match
      })
  }

  const captureCssCache = new Map()
  const sectionHtmlCache = new Map()

  function loadCaptureCss(captureId) {
    if (captureCssCache.has(captureId)) return captureCssCache.get(captureId)
    const promise = fetch('/style-scout/api/captures/' + encodeURIComponent(captureId) + '/page.css')
      .then((response) => (response.ok ? response.text() : ''))
      .catch(() => '')
    captureCssCache.set(captureId, promise)
    return promise
  }

  function loadSectionHtml(captureId, sectionId) {
    const key = captureId + '/' + sectionId
    if (sectionHtmlCache.has(key)) return sectionHtmlCache.get(key)
    const promise = fetch('/style-scout/api/captures/' + encodeURIComponent(captureId) + '/sections/' + encodeURIComponent(sectionId))
      .then((response) => (response.ok ? response.text() : ''))
      .catch(() => '')
    sectionHtmlCache.set(key, promise)
    return promise
  }

  function stripUnsafe(html) {
    return String(html)
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
      .replace(/<meta[^>]+http-equiv\s*=\s*("[^"]*refresh[^"]*"|'[^']*refresh[^']*'|refresh)[^>]*>/gi, '')
      .replace(/<base[^>]*>/gi, '')
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
  }

  async function blockDoc(block, entry) {
    const vars = varsCss(themeVars(entry))
    const theme = '<style>:root{' + vars + '}body{margin:0;background:var(--ss-bg);color:var(--ss-text);font-family:var(--ss-font-body)}</style>'
    if (block.type === 'atom') {
      let style = block.atom.style || {}
      try { style = JSON.parse(mapColors(JSON.stringify(style), entry)) } catch {}
      const bits = []
      if (style.background && style.background !== 'rgba(0, 0, 0, 0)') bits.push('background:' + style.background)
      if (style.color) bits.push('color:' + style.color)
      if (style.border && style.border !== 'none') bits.push('border:' + style.border)
      bits.push('border-radius:' + (style.borderRadius || '10px'))
      bits.push('padding:8px 14px')
      bits.push('font-size:' + (style.fontSize || '14px'))
      bits.push('font-weight:' + (style.fontWeight || '500'))
      if (style.fontFamily) bits.push('font-family:' + style.fontFamily)
      if (style.boxShadow) bits.push('box-shadow:' + style.boxShadow)
      return '<!doctype html><html><head><meta charset="utf-8">' + theme +
        '<style>body{padding:16px;display:flex;align-items:center;justify-content:center}.atom{display:inline-flex;align-items:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;' + bits.join(';') + '}</style></head><body><div class="atom">' + escapeHtml(block.atom.text || 'Component') + '</div></body></html>'
    }
    if (block.type === 'image') {
      return '<!doctype html><html><head><meta charset="utf-8">' + theme +
        '<style>body{display:flex;align-items:center;justify-content:center;background:var(--ss-surface)}img{max-width:100%;max-height:100%;object-fit:contain}</style></head><body><img src="' + escapeHtml(block.src || '') + '" alt=""></body></html>'
    }
    const css = await loadCaptureCss(block.captureId)
    const html = await loadSectionHtml(block.captureId, block.sectionId)
    return '<!doctype html><html><head><meta charset="utf-8"><style>' + mapColors(css, entry) + '</style>' + theme +
      '</head><body>' + mapColors(stripUnsafe(html), entry) + '</body></html>'
  }

  function blockHeight(block) {
    if (block.type === 'atom') return 150
    if (block.type === 'image') return 220
    const height = block.bbox && block.bbox.h ? block.bbox.h : 240
    return Math.max(140, Math.min(620, Math.round(height * 0.45)))
  }

  function renderBlock(block, entry, side) {
    const wrap = el('div', { class: 'block', 'data-block-id': block.id, 'data-layer-id': 'block:' + block.id, draggable: side === 'a' ? 'true' : 'false' })
    if (state.selectedLayer === 'block:' + block.id) wrap.classList.add('selected')
    const actions = side === 'a'
      ? el('div', { class: 'block-actions' }, [
          miniBtn('↑', () => moveBlock(block.id, -1)),
          miniBtn('↓', () => moveBlock(block.id, 1)),
          miniBtn('⧉', () => duplicateBlock(block.id)),
          miniBtn('✕', () => removeBlock(block.id)),
        ])
      : null
    wrap.append(el('div', { class: 'block-bar' }, [
      el('span', { class: 'block-kind', text: block.kindLabel || block.type }),
      el('span', { class: 'block-title', text: block.label || '' }),
      actions,
    ]))
    const body = el('div', { class: 'block-body' })
    const frame = el('iframe', { class: 'block-frame', title: block.label || 'block', sandbox: 'allow-same-origin' })
    if (block.type === 'section') {
      const capturedHeight = Math.max(120, Math.min(2400, (block.bbox && block.bbox.h) || 400))
      frame.style.width = '1440px'
      frame.style.height = capturedHeight + 'px'
      body.dataset.blockHeight = String(capturedHeight)
    } else {
      frame.style.height = blockHeight(block) + 'px'
    }
    body.append(frame)
    wrap.append(body)
    blockDoc(block, entry)
      .then((doc) => { if (frame.isConnected) frame.srcdoc = doc })
      .catch(() => {})
    if (side === 'a') {
      wrap.addEventListener('dragstart', (event) => {
        dragBlockId = block.id
        try { event.dataTransfer.setData('text/plain', block.id) } catch {}
      })
      wrap.addEventListener('dragover', (event) => event.preventDefault())
      wrap.addEventListener('drop', (event) => {
        event.preventDefault()
        reorderBlock(dragBlockId, block.id)
      })
      wrap.addEventListener('dragend', () => { dragBlockId = null })
    }
    return wrap
  }

  /** Scale captured sections (designed at 1440px) into the canvas column. */
  function fitBlocks() {
    for (const body of document.querySelectorAll('.block-body, .slot-body, .region-body')) {
      const frame = body.querySelector(':scope > iframe.block-frame')
      if (!frame) continue
      const capturedHeight = Number(body.dataset.blockHeight || 0)
      if (capturedHeight > 0) {
        const scale = Math.min(1, (body.clientWidth || 600) / 1440)
        frame.style.transformOrigin = 'top left'
        frame.style.transform = 'scale(' + scale + ')'
        body.style.height = Math.max(30, Math.min(620, Math.round(capturedHeight * scale))) + 'px'
        body.style.overflow = 'hidden'
      }
    }
  }

  function updateCanvasHead() {
    const skinA = $('skin-a')
    const skinB = $('skin-b')
    if (!skinA || !skinB) return
    const options = state.entries.length > 0
      ? state.entries.concat(state.themes.map(themeToEntry))
      : [selectedEntry()].filter(Boolean)
    const fill = (select, current) => {
      select.replaceChildren(...options.map((entry) => el('option', { value: entry.id, text: entry.label || entry.id })))
      if (current && options.some((entry) => entry.id === current)) select.value = current
      else if (options[0]) select.value = options[0].id
      return select.value
    }
    const valueA = fill(skinA, draft.skinA)
    const valueB = fill(skinB, draft.skinB)
    if (!draft.skinA && valueA) draft.skinA = valueA
    if (!draft.skinB && valueB) draft.skinB = valueB
    skinB.style.display = draft.split ? '' : 'none'
    const splitToggle = $('split-toggle')
    if (splitToggle) splitToggle.checked = draft.split
    document.querySelectorAll('#canvas-mode button').forEach((button) => {
      button.classList.toggle('on', draft.mode === button.dataset.mode)
    })
    const templateSelect = $('template-select')
    if (templateSelect) {
      const signature = TEMPLATES.map((template) => template.id).join(',') + '|' + state.customTemplates.map((template) => template.id).join(',')
      if (templateSelect.dataset.signature !== signature) {
        const builtin = TEMPLATES.map((template) => el('option', { value: template.id, text: template.name }))
        const custom = state.customTemplates.map((template) => el('option', { value: template.id, text: '我的模板 · ' + template.name }))
        templateSelect.replaceChildren(...(custom.length > 0 ? [el('optgroup', { label: '内置模板' }, builtin), el('optgroup', { label: '我的模板' }, custom)] : builtin))
        templateSelect.dataset.signature = signature
      }
      templateSelect.value = currentTemplate().id
      templateSelect.style.display = draft.mode === 'template' ? '' : 'none'
    }
    const autofillButton = $('autofill')
    if (autofillButton) autofillButton.style.display = draft.mode === 'template' ? '' : 'none'
    const saveTemplateButton = $('save-template')
    if (saveTemplateButton) saveTemplateButton.style.display = draft.mode === 'template' ? '' : 'none'
    const deleteTemplateButton = $('delete-template')
    if (deleteTemplateButton) deleteTemplateButton.style.display = draft.mode === 'template' && isCustomTemplateId(draft.templateId) ? '' : 'none'
    for (const id of ['export-template', 'import-template']) {
      const button = $(id)
      if (button) button.style.display = draft.mode === 'template' ? '' : 'none'
    }
    const isRegions = draft.mode === 'regions'
    for (const id of ['artboard', 'region-type', 'add-region', 'region-sep', 'export-layout', 'ai-layout', 'ai-generate']) {
      const node = $(id)
      if (node) node.style.display = isRegions ? '' : 'none'
    }
    const artboardSelect = $('artboard')
    if (artboardSelect) artboardSelect.value = draft.artboard || 'desktop'
    if (splitToggle) splitToggle.parentElement.style.display = isRegions ? 'none' : ''
    const hint = $('canvas-hint')
    if (hint) {
      const blocks = activeBlocks()
      hint.textContent = draft.mode === 'template'
        ? '模板：' + currentTemplate().name + ' · ' + blocks.length + '/' + templateSlots().length + ' 个空位已填（可直接把左侧区块拖进空位，或点空位选择）· 区域画布 / AI 分区 在「区域画布」页签'
        : draft.mode === 'regions'
          ? '区域画布 · ' + draft.regions.length + ' 个区域 · 画布 ' + (ARTBOARD_WIDTHS[draft.artboard] || 1440) + ' × ' + (ARTBOARD_HEIGHTS[draft.artboard] || 900) + '（拖素材进区域；⋮⋮ 排序；右下角改列宽）'
          : (blocks.length > 0 ? blocks.length + ' 个块 · 拖动排序' : '从左侧把区块拖进画布，或点「＋ 画布」')
    }
  }

  /* ---------- page templates (V2-6 填空题) ---------- */
  const TEMPLATES = [
    {
      id: 'landing',
      name: '落地页',
      slots: [
        { id: 'nav', label: '顶部导航', kinds: ['nav'], hint: '全站导航条' },
        { id: 'hero', label: 'Hero 主视觉', kinds: ['hero'], hint: '首屏标题 + 行动号召' },
        { id: 'features', label: '特性区', kinds: ['features', 'section'], hint: '3 列特性卡片' },
        { id: 'pricing', label: '定价 / 行动区', kinds: ['pricing', 'cta', 'section'], hint: '价格表或 CTA' },
        { id: 'footer', label: '页脚', kinds: ['footer'], hint: '链接与版权' },
      ],
    },
    {
      id: 'product',
      name: '产品介绍页',
      slots: [
        { id: 'nav', label: '顶部导航', kinds: ['nav'], hint: '全站导航条' },
        { id: 'hero', label: 'Hero 主视觉', kinds: ['hero'], hint: '一句话价值主张' },
        { id: 'showcase', label: '产品展示', kinds: ['features', 'section', 'testimonials'], hint: '截图 / 卡片墙' },
        { id: 'social', label: '客户评价', kinds: ['testimonials', 'section', 'pricing'], hint: '引用与信任背书' },
        { id: 'footer', label: '页脚', kinds: ['footer'], hint: '链接与版权' },
      ],
    },
    {
      id: 'content',
      name: '内容页',
      slots: [
        { id: 'nav', label: '顶部导航', kinds: ['nav'], hint: '全站导航条' },
        { id: 'title', label: '标题区', kinds: ['hero', 'section'], hint: '文章标题与摘要' },
